<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Drift</title>
<style>
:root{--bg:#0b0a1a;--fg:#e8e6ff;--a:#ff2bd6;--b:#19e6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:rgba(8,6,24,.86);text-align:center;padding:14px;overflow:auto}
h1{margin:0;font-size:clamp(34px,9vw,64px);letter-spacing:.12em;color:var(--b);text-shadow:0 0 18px var(--b),0 0 40px var(--a)}
h2{margin:0;color:var(--a)}p{margin:2px;max-width:460px}small{opacity:.7}
button{background:#1b1740;color:var(--fg);border:1px solid var(--b);border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer;min-width:230px;box-shadow:0 0 10px #19e6ff44}
button:hover{background:#2a2470}input{background:#120f2e;color:var(--fg);border:1px solid var(--a);border-radius:8px;padding:9px;font:inherit;width:190px}
.b{color:#ffd02b}
textarea,input{-webkit-user-select:text;user-select:text}
</style></head><body>
<canvas id="c"></canvas><div id="ov"></div>
<script>
"use strict";
/* ===== Core ===== */
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),cr=Math.random;
let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',rs);rs();
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hs(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const cleanSeed=s=>String(s).replace(/[^\w-]/g,'').slice(0,24);
/* ===== Save ===== */
const DS=()=>({v:1,shards:0,up:{hp:0,dmg:0,spd:0,mag:0},best:0,runs:0,kills:0,daily:{},fx:1,mute:0,nm:0,genre:0,bot:0,script:'',pend:''});
const lget=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Whitelist + clamp everything: used for stored AND imported profiles (imported data is untrusted) */
function clean(o){o=o&&typeof o==='object'?o:{};const d=DS(),n=(x,hi)=>Number.isFinite(+x)?Math.floor(Math.min(hi,Math.max(0,+x))):0;
d.shards=n(o.shards,1e9);d.best=n(o.best,1e7);d.runs=n(o.runs,1e7);d.kills=n(o.kills,1e9);for(const k of['hp','dmg','spd','mag'])d.up[k]=n(o.up&&o.up[k],5);
if(o.daily&&typeof o.daily==='object')for(const k of Object.keys(o.daily).slice(0,400))if(/^\d{4}-\d{2}-\d{2}$/.test(k))d.daily[k]=n(o.daily[k],1e6);
d.fx=o.fx===0||o.fx===false?0:1;d.mute=o.mute?1:0;d.nm=o.nm?1:0;d.genre=n(o.genre,5);d.bot=n(o.bot,2);
if(typeof o.script==='string')d.script=o.script.slice(0,20000);if(typeof o.pend==='string')d.pend=o.pend.slice(0,20000);return d}
let PR={a:'p1',l:[{id:'p1',name:'Player 1'}]},S=DS(),xcf=0;
const nid=()=>{let i;do i='p'+Date.now().toString(36)+(Math.random()*1e3|0).toString(36);while(PR.l.some(p=>p.id===i));return i};
const pn=()=>(PR.l.find(p=>p.id===PR.a)||PR.l[0]).name;
function loadCur(){let raw=lget('neondrift:p:'+PR.a);if(!raw&&PR.a==='p1')raw=lget('neondrift');try{S=clean(JSON.parse(raw||'{}'))}catch(e){S=DS()}}
try{const i=JSON.parse(lget('neondrift:idx')||'null');if(i&&Array.isArray(i.l)&&i.l.length){const l=i.l.slice(0,20).map(p=>({id:String(p.id).replace(/\W/g,''),name:String(p.name).slice(0,24)})),a=String(i.a).replace(/\W/g,'');if(l.some(p=>p.id===a))PR={a,l}}}catch(e){}
loadCur();
const save=()=>{lset('neondrift:p:'+PR.a,JSON.stringify(S));lset('neondrift:idx',JSON.stringify(PR))};
/* ===== Profiles + export/import (text codes: ND1.<base64 json>.<checksum>) ===== */
function pfList(m){show(`<h2>Profiles</h2><p class=b>${m||''}</p>`+PR.l.map(p=>`<button onclick="pfSwitch('${p.id}')">${p.id===PR.a?'▶ ':''}${esc(p.name)}</button>`).join('')+`<button onclick="pfName(0)">+ New profile</button><button onclick="pfName(1)">Rename current</button><button onclick="pfDel()">Delete current</button><button onclick="pfXfer()">Export / Import</button><button onclick="title()">Back</button>`)}
function pfSwitch(id){save();if(PR.l.some(p=>p.id===id)){PR.a=id;loadCur();save()}pfList('Active: '+esc(pn()))}
function pfName(mode){show(`<h2>${mode?'Rename':'New'} profile</h2><input id=pn maxlength=24 value="${mode?esc(pn()):''}"><button onclick="pfSave(${mode})">Save</button><button onclick="pfList()">Cancel</button>`)}
function pfSave(mode){const v=$('pn').value.trim().slice(0,24)||'Player';if(mode)PR.l.find(p=>p.id===PR.a).name=v;else{if(PR.l.length>=20)return pfList('Profile limit reached (20).');save();const id=nid();PR.l.push({id,name:v});PR.a=id;S=DS()}save();pfList('Saved.')}
function pfDel(){if(PR.l.length<2)return pfList('Keep at least one profile.');show(`<h2>Delete “${esc(pn())}”?</h2><p>Export it first if you want a backup.</p><button onclick="pfDelOk()">Delete</button><button onclick="pfList()">Cancel</button>`)}
function pfDelOk(){try{localStorage.removeItem('neondrift:p:'+PR.a)}catch(e){}PR.l=PR.l.filter(p=>p.id!==PR.a);PR.a=PR.l[0].id;loadCur();save();pfList('Deleted.')}
function pfEnc(){const inc=$('ixs')&&$('ixs').checked,d=JSON.parse(JSON.stringify(S));delete d.pend;if(inc)d.script=S.script||S.pend;else{d.script='';if(d.bot===2)d.bot=1}
const b=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,name:pn(),d}))));return'ND1.'+b+'.'+hs(b).toString(36)}
function pfDec(c){const m=/^ND1\.([A-Za-z0-9+/=]+)\.([0-9a-z]+)$/.exec(String(c).replace(/\s+/g,''));if(!m||hs(m[1]).toString(36)!==m[2])throw Error('Code is incomplete or corrupted.');
const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||o.v!==1||!o.d)throw Error('Unsupported code version.');return o}
function pfXfer(){xcf=0;show(`<h2>Export / Import</h2><p><small>Copy this code to move “${esc(pn())}” to another browser or device. To import, paste a code over it. Codes are plain text and can be edited by hand, so they are not tamper-proof.</small></p><label><input type=checkbox id=ixs onchange="pfGen()"> include my bot script</label><textarea id=xc spellcheck=false onfocus="this.select()" style="width:min(92vw,520px);height:22vh;background:#120f2e;color:#e8e6ff;border:1px solid #ff2bd6;border-radius:8px;padding:8px;font:11px monospace"></textarea><button onclick="pfCopy()">Copy code</button><button onclick="pfImp(0)">Import as new profile</button><button onclick="pfImp(1)">Import over current</button><p id=xm class=b></p><button onclick="pfList()">Back</button>`);pfGen()}
function pfGen(){$('xc').value=pfEnc();$('xm').textContent=''}
function pfCopy(){const t=$('xc');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}$('xm').textContent='Copied (or press Ctrl/Cmd+C).'}
function pfImp(over){const m=$('xm');try{const o=pfDec($('xc').value),d=clean(o.d);d.pend=d.script||d.pend;d.script='';if(d.bot===2)d.bot=1;
if(over){if(!xcf){xcf=1;m.textContent='This replaces the current profile. Click again to confirm.';return}S=d}else{if(PR.l.length>=20){m.textContent='Profile limit reached (20).';return}save();const id=nid();PR.l.push({id,name:String(o.name||'Imported').slice(0,24)});PR.a=id;S=d}
save();pfList('Imported ✓'+(d.pend?' Bot script was NOT enabled: review it under Edit bot script.':''))}catch(e){m.textContent=String(e.message||e)}}
/* ===== Audio ===== */
let AC;
function snd(f,d=.08,t='square',v=.04){if(S.mute)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),n=AC.createGain();o.type=t;o.frequency.value=f;n.gain.value=v;n.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(n);n.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
/* ===== World gen: chunk = pure function of (seed, cx, cy) ===== */
const CS=512,BIO=[{n:'Neon Flats',bg:'#0d0b24',ob:'#19e6ff',gr:'#1a1650'},{n:'Magma Grid',bg:'#1e0a0f',ob:'#ff6a2b',gr:'#3a1218'},{n:'Toxic Bloom',bg:'#07190f',ob:'#7dff3a',gr:'#0f3a1c'},{n:'Void Glass',bg:'#140a24',ob:'#d46bff',gr:'#2a1450'}];
let seed='',rnd=Math.random,chunks=new Map();
const bioAt=(x,y)=>BIO[hs(seed+'b'+Math.floor(x/1536)+','+Math.floor(y/1536))%4];
function chunk(cx,cy){const k=(cx+4096)*8192+cy+4096;let c=chunks.get(k);if(c)return c;
const r=mb(hs(seed+'c'+cx+','+cy)),n=3+(r()*5|0);c={cx,cy,o:[]};
for(let i=0;i<n;i++){const x=cx*CS+r()*CS,y=cy*CS+r()*CS,rad=18+r()*40;if(Math.hypot(x,y)>rad+190)c.o.push({x,y,r:rad})}
chunks.set(k,c);return c}
function pushOut(e){const cx=Math.floor(e.x/CS),cy=Math.floor(e.y/CS);
for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const o=chunk(cx+i,cy+j).o;for(let k=0;k<o.length;k++){const a=o[k],dx=e.x-a.x,dy=e.y-a.y,m=a.r+e.r,d2=dx*dx+dy*dy;if(d2<m*m){const d=Math.sqrt(d2)||1;e.x=a.x+dx/d*m;e.y=a.y+dy/d*m}}}}
/* ===== Content ===== */
const ET=[{hp:18,s:62,r:10,d:8,c:'#ff2bd6'},{hp:8,s:110,r:7,d:5,c:'#ffd02b'},{hp:90,s:40,r:18,d:14,c:'#ff6a2b'},{hp:26,s:50,r:10,d:6,c:'#b36bff'},{hp:40,s:55,r:14,d:9,c:'#7dff3a'},{hp:900,s:50,r:42,d:20,c:'#ff2b4a'}];
const UP=[{id:'bolt',n:'Plasma Bolt',d:'Auto-fires at the nearest foe'},{id:'orb',n:'Orbit Blades',d:'Blades circle you'},{id:'nova',n:'Pulse Nova',d:'Periodic shockwave'},
{id:'spd',n:'Swift Boots',d:'+12% speed',p:1},{id:'dmg',n:'Overcharge',d:'+20% damage',p:1},{id:'rate',n:'Rapid Fire',d:'+15% fire rate',p:1},{id:'hp',n:'Vitality',d:'+25 max HP & heal',p:1},{id:'mag',n:'Magnet',d:'+40% pickup range',p:1}];
const SH=[['hp','Vitality +15 HP'],['dmg','Power +8% damage'],['spd','Speed +5%'],['mag','Magnet +15%']];
/* ===== State ===== */
let st='title',P,E=[],B=[],EB=[],GM=[],PK=[],PT=[],RG=[],T=0,kills=0,lvl=1,xp=0,xpn=5,sa=0,bossN=0,shake=0,cam={x:0,y:0},CH=[],fr=null,run='',gc=0;
const K={},GS=64,GN=30,grid=Array.from({length:GN*GN},()=>[]);let gox=0,goy=0,joy=null;
/* ===== UI ===== */
const show=h=>{$('ov').innerHTML=h;$('ov').style.display='flex'},hide=()=>{$('ov').style.display='none'};
function decode(v){try{const o=JSON.parse(atob(v.trim().replace(/^.*#r=/,'')));if(o&&o.s)return{s:cleanSeed(o.s),t:+o.t|0,k:+o.k|0,l:+o.l|0}}catch(e){}return null}
function title(){st='title';musicStop();const d=new Date().toISOString().slice(0,10);
show(`<h1>NEON DRIFT</h1><p>Survive the swarm across an endless procedural grid.</p>
${fr?`<p class=b>Friend lasted ${fr.t}s, ${fr.k} kills, level ${fr.l} on seed <b>${fr.s}</b></p><button onclick="start('${fr.s}')">Beat their seed</button>`:''}
<button onclick="start('D${d}')">Daily Challenge · best ${S.daily[d]||0}s</button>
<button onclick="start(''+Date.now())">Random Run</button>
<div><input id=sd placeholder="seed or friend code"> <button style="min-width:0" onclick="go()">Go</button></div>
<button onclick="pfList()">Profile: ${esc(pn())} · export/import</button>
<button onclick="shop()">Shard Shop · ${S.shards}◆</button>
<button onclick="cb()">Co-op bot: ${['off','built-in AI','custom script'][S.bot||0]}</button><button onclick="ed()">Edit bot script</button>
<button onclick="tg('mute')">Sound: ${S.mute?'off':'on'}</button>
<button onclick="tg('nm')">Music: ${S.nm?'off':'on'}</button><button onclick="cg()">Genre: ${(S.genre|0)?GEN[S.genre-1].n:'Auto (adaptive)'}</button>
<small>Best ${S.best}s · ${S.runs} runs · ${S.kills} kills<br>Move: WASD / arrows / drag · Pause: P</small>`)}
function go(){const v=$('sd').value.trim(),f=decode(v);if(f){fr=f;title()}else start(cleanSeed(v)||''+Date.now())}
function tg(k){S[k]=S[k]?0:1;save();st==='pause'?pauseUI():title()}
function shop(){show(`<h2>Shard Shop</h2><p>${S.shards}◆ available</p>`+SH.map(([k,n])=>{const l=S.up[k];return l>=5?`<p>${n} · MAX</p>`:`<button onclick="buy('${k}')">${n} · Lv${l}/5 · ${20*(l+1)}◆</button>`}).join('')+`<button onclick="title()">Back</button>`)}
function buy(k){const l=S.up[k],c=20*(l+1);if(l<5&&S.shards>=c){S.shards-=c;S.up[k]++;save();snd(700,.1)}shop()}
function pauseUI(){st='pause';show(`<h2>Paused</h2><p>Seed <b>${run}</b></p><button onclick="resume()">Resume</button><button onclick="tg('fx')">Shake & particles: ${S.fx?'on':'off'}</button><button onclick="tg('mute')">Sound: ${S.mute?'off':'on'}</button><button onclick="tg('nm')">Music: ${S.nm?'off':'on'}</button><button onclick="cg()">Genre: ${(S.genre|0)?GEN[S.genre-1].n:'Auto (adaptive)'}</button><button onclick="title()">Quit run</button>`)}
function resume(){if(st==='pause'){hide();st='play'}}
/* ===== Run ===== */
function start(sd){seed=cleanSeed(sd)||'0';run=seed;rnd=mb(hs(seed+'g'));chunks=new Map();const u=S.up;
P={x:0,y:0,r:12,hp:100+15*u.hp,mhp:100+15*u.hp,spd:170*(1+.05*u.spd),dmg:1+.08*u.dmg,rate:1,mag:70*(1+.15*u.mag),w:{bolt:1,orb:0,nova:0},cd:0,ncd:2,ang:0,iv:0};
E=[];B=[];EB=[];GM=[];PK=[];PT=[];RG=[];T=0;kills=0;lvl=1;xp=0;xpn=5;sa=0;bossN=0;shake=0;gc=0;cam={x:0,y:0};botInit();musicStart();hide();st='play';snd(440,.15,'sawtooth')}
function over(){st='over';const earn=Math.floor(T/6+kills/8);S.shards+=earn;S.runs++;S.kills+=kills;S.best=Math.max(S.best,T|0);
if(/^D\d{4}-/.test(run))S.daily[run.slice(1)]=Math.max(S.daily[run.slice(1)]||0,T|0);save();
musicStop();const code=btoa(JSON.stringify({s:run,t:T|0,k:kills,l:lvl}));snd(120,.5,'sawtooth',.08);
show(`<h2>Run over</h2><p>${T|0}s · ${kills} kills · level ${lvl}</p><p class=b>+${earn}◆ shards</p><p>Share this code with a friend:</p><input id=cd readonly value="${code}" onclick="this.select()"><button onclick="cp()">Copy link</button><button onclick="start('${run}')">Retry same seed</button><button onclick="start(''+Date.now())">New run</button><button onclick="shop()">Shop</button><button onclick="title()">Title</button>`)}
function cp(){const u=location.href.split('#')[0]+'#r='+$('cd').value;try{navigator.clipboard.writeText(u)}catch(e){}$('cd').select()}
function burst(x,y,c,n){if(!S.fx||PT.length>300)return;for(let i=0;i<n;i++){const a=cr()*6.28,s=40+cr()*140;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+cr()*.3,c})}}
function spawn(boss){const a=rnd()*6.283,R=Math.hypot(W,H)/2+60,k=boss?5:Math.min(4,(rnd()*(1+T/30))|0),t=ET[k],m=1+T/100;
const hp=boss?t.hp*(1+bossN*.8):t.hp*m;E.push({k,x:P.x+Math.cos(a)*R,y:P.y+Math.sin(a)*R,r:t.r,hp,mh:hp,s:t.s,d:t.d,c:t.c,cd:2+rnd(),fl:0,oc:0,lb:null})}
function shoot(x,y,a,s,d){EB.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,d,l:5})}
function die(e){kills++;burst(e.x,e.y,e.c,8);const v=e.k===5?15:e.k===2?3:1;for(let i=0;i<(e.k===5?10:1);i++)GM.push({x:e.x+(i?(cr()-.5)*60:0),y:e.y+(i?(cr()-.5)*60:0),v:e.k===5?2:v});
if(e.k===4)for(let i=0;i<2;i++)E.push({k:1,x:e.x+i*12,y:e.y,r:7,hp:8,mh:8,s:110,d:5,c:ET[1].c,cd:0,fl:0,oc:0,lb:null});
if(e.k===5){shake=14;bossN++;S.shards+=10}else if(rnd()<.025)PK.push({x:e.x,y:e.y});snd(180+cr()*60,.05,'triangle',.03)}
function hurt(e,d){e.hp-=d;e.fl=.07}
function lvlup(){lvl++;xp-=xpn;xpn=Math.floor(xpn*1.3+3);const pool=UP.filter(u=>u.p||P.w[u.id]<6),c=[];
while(c.length<3&&pool.length)c.push(pool.splice(rnd()*pool.length|0,1)[0]);CH=c;st='pick';snd(880,.2,'sine',.06);
show(`<h2>Level ${lvl}</h2>`+c.map((u,i)=>`<button onclick="pick('${u.id}')">${i+1}. ${u.n}${u.p?'':P.w[u.id]?' → Lv'+(P.w[u.id]+1):' (NEW)'}<br><small>${u.d}</small></button>`).join(''))}
function pick(id){if(st!=='pick')return;if(P.w[id]!==undefined)P.w[id]++;else if(id==='spd')P.spd*=1.12;else if(id==='dmg')P.dmg*=1.2;else if(id==='rate')P.rate*=1.15;else if(id==='hp'){P.mhp+=25;P.hp=Math.min(P.mhp,P.hp+25)}else if(id==='mag')P.mag*=1.4;hide();st='play'}
/* ===== Simulation (fixed 60 Hz) ===== */
function build(){gox=P.x-GN*GS/2;goy=P.y-GN*GS/2;for(let i=0;i<grid.length;i++)grid[i].length=0;
for(let i=0;i<E.length;i++){const e=E[i],gx=((e.x-gox)/GS)|0,gy=((e.y-goy)/GS)|0;if(gx>=0&&gy>=0&&gx<GN&&gy<GN)grid[gy*GN+gx].push(e)}}
function near(x,y,r,f){const gx=((x-gox)/GS)|0,gy=((y-goy)/GS)|0;for(let j=gy-1;j<=gy+1;j++)for(let i=gx-1;i<=gx+1;i++){if(i<0||j<0||i>=GN||j>=GN)continue;const c=grid[j*GN+i];for(let k=0;k<c.length;k++){const e=c[k];if(e.hp>0&&Math.hypot(e.x-x,e.y-y)<e.r+r&&f(e))return}}}
function tick(dt){T+=dt;gc+=dt;
let ix=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),iy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(joy){ix+=joy.dx;iy+=joy.dy}
const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}P.x+=ix*P.spd*dt;P.y+=iy*P.spd*dt;pushOut(P);P.iv-=dt;shake=Math.max(0,shake-dt*30);
cam.x+=(P.x-cam.x)*.12;cam.y+=(P.y-cam.y)*.12;
if(gc>5){gc=0;for(const[k,c]of chunks)if(Math.abs(c.cx-Math.floor(P.x/CS))>4||Math.abs(c.cy-Math.floor(P.y/CS))>4)chunks.delete(k)}
sa+=dt*(2+T/20);while(sa>=1){sa--;if(E.length<450)spawn(false)}
if(T>=150*(bossN+1)&&!E.some(e=>e.k===5))spawn(true);
build();
/* weapons */
P.cd-=dt;const bl=P.w.bolt;if(bl&&P.cd<=0){let best=null,bd=1e9;for(let i=0;i<E.length;i++){const e=E[i],d=(e.x-P.x)**2+(e.y-P.y)**2;if(d<bd){bd=d;best=e}}
if(best&&bd<640000){const n=1+(bl>=3)+(bl>=5),a=Math.atan2(best.y-P.y,best.x-P.x);for(let i=0;i<n;i++){const aa=a+(i-(n-1)/2)*.14;B.push({x:P.x,y:P.y,vx:Math.cos(aa)*520,vy:Math.sin(aa)*520,d:10*P.dmg*(1+.18*(bl-1)),p:bl>=4?2:0,l:1.2})}P.cd=Math.max(.12,.6/P.rate-.04*bl);snd(520,.04,'square',.015)}else P.cd=.1}

function mstep(t,it,boss,sd,G){const r=mu.rng,s=mu.step&15,bar=mu.step>>4,sc=G.sc,tt=t+(s&1?G.sw*sd:0);
if(s===0&&r()<.5)mu.pat[r()*16|0]=r();
const nt=d=>mu.root+sc[((d%sc.length)+sc.length)%sc.length]+12*Math.floor(d/sc.length),cd=mu.prog[bar&3],h=c=>c[s]==='1'?1:c[s]==='2'?1.5:0;let v;
if(v=h(G.k)){const o=AC.createOscillator(),a=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);a.gain.setValueAtTime(.45*v,t);a.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(a);a.connect(mu.gain);o.start(t);o.stop(t+.18)}
if(v=h(G.s))nz(t,1800,.14*v,.12,'bandpass');
if((v=h(G.h))&&it>=G.ht)nz(tt,7000,.09*v,.04,'highpass');
if(v=h(G.bs))tn(G.bw,mf(nt(cd)+(G.bo||0)),t,sd*(G.bd||1.8),.15*v,G.bl+it*(G.bf||0));
if(T>=G.at&&mu.pat[(s+bar*5)&15]<G.ad)tn(G.aw,mf(nt(cd+[0,2,4,7,9][(mu.pat[(s*3+bar)&15]*5)|0])+12*G.ao),tt,sd*G.al,G.av,G.af);
if(s===0&&G.pv)for(let k=0;k<5;k+=2)tn(G.pw,mf(nt(cd+k)+12),t,sd*16,G.pv,900);
if(boss&&s%2===0)tn('sawtooth',mf(nt(cd)+12),t,sd*1.5,.06,1200)}
function musicSched(){if(!mu.gain||!P)return;const now=AC.currentTime;if(S.mute||S.nm){mu.next=now+.1;return}
mu.gain.gain.setTargetAtTime(st==='play'?.5:.18,now,.15);if(mu.next<now-.1)mu.next=now+.05;
const it=Math.min(1,E.length/300+T/500),boss=E.some(e=>e.k===5),G=curGenre(boss),sd=15/(G.b[0]+(G.b[1]-G.b[0])*it+(boss?10:0));
while(mu.next<now+.2){mstep(mu.next,it,boss,sd,G);mu.step++;mu.next+=sd}}

let acc=0,last=0;
function frame(t){requestAnimationFrame(frame);const d=Math.min((t-last)/1000,.1);last=t;if(st==='play'){acc+=d;while(acc>=1/60&&st==='play'){tick(1/60);acc-=1/60}}draw()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if(k==='p'||k==='escape'){st==='play'?pauseUI():st==='pause'&&resume()}
if(st==='pick'&&CH[+k-1])pick(CH[+k-1].id);if(k.startsWith('arrow')&&st!=='title')e.preventDefault()});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')pauseUI()});addEventListener('blur',()=>{if(st==='play')pauseUI()});
cv.addEventListener('pointerdown',e=>{joy={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0};try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;let dx=(e.clientX-joy.x)/50,dy=(e.clientY-joy.y)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.dx=dx;joy.dy=dy});
const rj=e=>{if(joy&&e.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',rj);cv.addEventListener('pointercancel',rj);
