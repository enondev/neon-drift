<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Drift</title>
<style>
:root{--bg:#0b0a1a;--fg:#e8e6ff;--a:#ff2bd6;--b:#19e6ff;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:rgba(8,6,24,.86);text-align:center;padding:14px;overflow:auto}
h1{margin:0;font-size:clamp(34px,9vw,64px);letter-spacing:.12em;color:var(--b);text-shadow:0 0 18px var(--b),0 0 40px var(--a)}
h2{margin:0;color:var(--a)}p{margin:2px;max-width:460px}small{opacity:.7}
button{background:#1b1740;color:var(--fg);border:1px solid var(--b);border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer;min-width:230px;box-shadow:0 0 10px #19e6ff44}
button:hover{background:#2a2470}
input,textarea{background:#120f2e;color:var(--fg);border:1px solid var(--a);border-radius:8px;padding:9px;font:inherit}
input{width:190px}.b{color:#ffd02b}
textarea,input{-webkit-user-select:text;user-select:text}
#ov {
  gap: 8px;
  padding: max(12px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
  max-width: 100%;
}
#ov h1 {
  font-size: clamp(28px, 8vw, 64px);
  line-height: 1.1;
}
#ov p, #ov small {
  max-width: min(460px, 92vw);
}
#ov button {
  min-width: min(230px, 92vw);
  max-width: 320px;
  width: 100%;
  box-sizing: border-box;
}
#ov .row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  width: min(460px, 92vw);
}

  flex: 1 1 140px;

#pk{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);display:none;z-index:15;background:#120f2ecc;border:1px solid var(--b);border-radius:12px;padding:8px 12px;text-align:center}
#pk button{min-width:0;margin:3px;padding:8px 12px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:none;z-index:20;background:#1b1740;border:1px solid var(--a);border-radius:10px;padding:10px 18px;text-align:center;box-shadow:0 0 18px #ff2bd666;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"></div><div id="toast"></div><div id="pk"></div>
<script>
"use strict";

/* ========== Helpers ========== */
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d'), rnd01 = Math.random;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const len = (x, y) => Math.hypot(x, y) || 1;
const limit = (x, y) => { const l = Math.hypot(x, y); return l > 1 ? [x / l, y / l] : [x, y]; };
const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanSeed = s => String(s || '').replace(/[^\w-]/g, '').slice(0, 24);

function mulberry(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ========== Persistence ========== */
/* ========== Meta layer: characters, mutators, achievements (defined before the save code runs) ========== */
let runMut = 0, lastSec = 0;                              // mutator bitmask for the current run, last whole second seen
const mutOn = i => (runMut >> i) & 1;

const MUT = [   // b = bonus shards multiplier added per active mutator
  { n: 'Glass Cannon', d: 'Deal double damage, HP is halved', b: 0.30 },
  { n: 'Swarm',        d: '+50% enemy spawn rate',            b: 0.25 },
  { n: 'Fast Foes',    d: 'Enemies move 25% faster',          b: 0.20 },
  { n: 'Elite Hunt',   d: 'Elites are three times as common', b: 0.25 },
  { n: 'Frail',        d: 'No regeneration, health packs heal half', b: 0.15 },
  { n: 'Iron Hide',    d: 'Enemies have 50% more HP',         b: 0.30 }
];
const maskBonus = m => 1 + MUT.reduce((a, x, i) => a + ((m >> i) & 1 ? x.b : 0), 0);
const mutBonus = () => maskBonus(runMut);
const dailyMask = sd => {                                   // the daily challenge always uses two fixed mutators
  const h = hashStr(sd + 'm'), a = h % MUT.length, b = (a + 1 + ((h >>> 8) % (MUT.length - 1))) % MUT.length;
  return (1 << a) | (1 << b);
};
const dailyNames = () => { const m = dailyMask('D' + new Date().toISOString().slice(0, 10)); return MUT.filter((x, i) => (m >> i) & 1).map(x => x.n).join(' + '); };

const CHAR = [  // w = starting weapon levels (merged over the default build), mod = stat tweaks, unlock = achievement id
  { n: 'Drifter',    d: 'Balanced all-rounder. Plasma Bolt.',                       w: {},                       mod: p => {} },
  { n: 'Arcanist',   d: 'Starts with Chain Lightning. +15% area, -15% HP.',         w: { bolt: 0, arc: 1 },      mod: p => { p.area *= 1.15; p.mhp = Math.round(p.mhp * 0.85); },            unlock: 'b1' },
  { n: 'Bomber',     d: 'Starts with Proximity Mines. +10% damage, -8% speed.',     w: { bolt: 0, mine: 1 },     mod: p => { p.dmg *= 1.1; p.spd *= 0.92; },                                  unlock: 't10' },
  { n: 'Gunslinger', d: 'Starts with Scatter Shards. +20% fire rate, -10% HP.',     w: { bolt: 0, shard: 1 },    mod: p => { p.rate *= 1.2; p.mhp = Math.round(p.mhp * 0.9); },              unlock: 'lv20' },
  { n: 'Warden',     d: 'Starts with Orbit Blades. +30% HP, +0.3 regen, -8% speed.', w: { bolt: 0, orb: 1 },     mod: p => { p.mhp = Math.round(p.mhp * 1.3); p.regen += 0.3; p.spd *= 0.92; }, unlock: 'e1' }
];
const charUnlocked = i => !CHAR[i].unlock || !!S.ach[CHAR[i].unlock];
const effChar = () => charUnlocked(S.ch) ? S.ch : 0;

const ACH = [
  { id: 't3',   n: 'Warming Up',    d: 'Survive 3 minutes',            t: () => time >= 180 },
  { id: 't5',   n: 'Staying Power', d: 'Survive 5 minutes',            t: () => time >= 300 },
  { id: 't10',  n: 'Marathon',      d: 'Survive 10 minutes',           t: () => time >= 600 },
  { id: 't15',  n: 'Endurance',     d: 'Survive 15 minutes',           t: () => time >= 900 },
  { id: 't20',  n: 'Unbreakable',   d: 'Survive 20 minutes',           t: () => time >= 1200 },
  { id: 't30',  n: 'Legend',        d: 'Survive 30 minutes',           t: () => time >= 1800 },
  { id: 'k100', n: 'First Blood',   d: '100 kills in one run',         t: () => kills >= 100 },
  { id: 'k500', n: 'Swarm Breaker', d: '500 kills in one run',         t: () => kills >= 500 },
  { id: 'k2k',  n: 'Slaughter',     d: '2,000 kills in one run',       t: () => kills >= 2000 },
  { id: 'k5k',  n: 'Extinction',    d: '5,000 kills in one run',       t: () => kills >= 5000 },
  { id: 'L1k',  n: 'Exterminator',  d: '1,000 lifetime kills',         t: () => S.kills + kills >= 1000 },
  { id: 'L10k', n: 'Apex Predator', d: '10,000 lifetime kills',        t: () => S.kills + kills >= 10000 },
  { id: 'lv10', n: 'Leveling Up',   d: 'Reach level 10',               t: () => level >= 10 },
  { id: 'lv20', n: 'Veteran',       d: 'Reach level 20',               t: () => level >= 20 },
  { id: 'lv30', n: 'Elite Build',   d: 'Reach level 30',               t: () => level >= 30 },
  { id: 'lv50', n: 'Ascendant',     d: 'Reach level 50',               t: () => level >= 50 },
  { id: 'b1',   n: 'Boss Slayer',   d: 'Defeat a boss',                t: () => S.bosses >= 1 },
  { id: 'b5',   n: 'Boss Rush',     d: 'Defeat 5 bosses in one run',   t: () => bossCount >= 5 },
  { id: 'b10',  n: 'Tyrant',        d: 'Defeat 10 bosses overall',     t: () => S.bosses >= 10 },
  { id: 'e1',   n: 'Evolved',       d: 'Evolve a weapon',              t: () => Object.keys(player.evo).length >= 1 },
  { id: 'e3',   n: 'Triple Threat', d: 'Evolve three weapons in a run', t: () => Object.keys(player.evo).length >= 3 },
  { id: 'max',  n: 'Maxed Out',     d: 'Take a weapon to level 6',     t: () => Object.values(player.w).some(v => v >= 6) },
  { id: 'dc',   n: 'Daily Driver',  d: 'Last a minute in a Daily Challenge', t: () => /^D\d{4}-/.test(runSeed) && time >= 60 },
  { id: 'm1',   n: 'Risk Taker',    d: 'Last 5 minutes with a mutator', t: () => runMut > 0 && time >= 300 },
  { id: 'm3',   n: 'Masochist',     d: 'Last 5 minutes with 3+ mutators', t: () => runMut.toString(2).replace(/0/g, '').length >= 3 && time >= 300 }
];
function unlockAch(a) {
  S.ach[a.id] = 1; save();
  const t = $('toast');
  t.innerHTML = '🏆 ' + a.n + '<br><small>' + a.d + '</small>'; t.style.display = 'block';
  playTone(880, 0.2, 'sine', 0.05);
  if (typeof setTimeout === 'function') setTimeout(() => { t.style.display = 'none'; }, 3500);
}
function checkAch() { if (player) for (const a of ACH) if (!S.ach[a.id] && a.t()) unlockAch(a); }

const defaultSave = () => ({
  v: 1, shards: 0, up: { hp: 0, dmg: 0, spd: 0, mag: 0 },
  best: 0, runs: 0, kills: 0, daily: {}, fx: 1, mute: 0, nm: 0,
  genre: 0, bot: 0, script: '', pend: '', ch: 0, mut: 0, bosses: 0, ach: {}
});
const lget = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lset = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

function sanitize(raw) {
  const o = raw && typeof raw === 'object' ? raw : {};
  const d = defaultSave();
  const n = (x, hi) => Number.isFinite(+x) ? Math.floor(clamp(+x, 0, hi)) : 0;
  d.shards = n(o.shards, 1e9); d.best = n(o.best, 1e7); d.runs = n(o.runs, 1e7); d.kills = n(o.kills, 1e9);
  for (const k of ['hp', 'dmg', 'spd', 'mag']) d.up[k] = n(o.up && o.up[k], 5);
  if (o.daily && typeof o.daily === 'object')
    for (const k of Object.keys(o.daily).slice(0, 400))
      if (/^\d{4}-\d{2}-\d{2}$/.test(k)) d.daily[k] = n(o.daily[k], 1e6);
  d.fx = o.fx === 0 || o.fx === false ? 0 : 1;
  d.mute = o.mute ? 1 : 0; d.nm = o.nm ? 1 : 0;
  d.genre = n(o.genre, 5); d.bot = n(o.bot, 2);
  if (typeof o.script === 'string') d.script = o.script.slice(0, 20000);
  if (typeof o.pend === 'string') d.pend = o.pend.slice(0, 20000);
  d.ch = n(o.ch, CHAR.length - 1); d.mut = n(o.mut, (1 << MUT.length) - 1); d.bosses = n(o.bosses, 1e6);
  if (o.ach && typeof o.ach === 'object') for (const a of ACH) if (o.ach[a.id]) d.ach[a.id] = 1;
  return d;
}

let profiles = { a: 'p1', l: [{ id: 'p1', name: 'Player 1' }] };
let S = defaultSave();
let confirmImport = 0;

const newId = () => {
  let id;
  do id = 'p' + Date.now().toString(36) + (Math.random() * 1e3 | 0).toString(36);
  while (profiles.l.some(p => p.id === id));
  return id;
};
const activeName = () => (profiles.l.find(p => p.id === profiles.a) || profiles.l[0]).name;

function loadProfile() {
  let raw = lget('neondrift:p:' + profiles.a);
  if (!raw && profiles.a === 'p1') raw = lget('neondrift');
  try { S = sanitize(JSON.parse(raw || '{}')); } catch { S = defaultSave(); }
}
try {
  const idx = JSON.parse(lget('neondrift:idx') || 'null');
  if (idx && Array.isArray(idx.l) && idx.l.length) {
    const list = idx.l.slice(0, 20).map(p => ({
      id: String(p.id).replace(/\W/g, ''),
      name: String(p.name).slice(0, 24)
    }));
    const active = String(idx.a).replace(/\W/g, '');
    if (list.some(p => p.id === active)) profiles = { a: active, l: list };
  }
} catch {}
loadProfile();
const save = () => {
  lset('neondrift:p:' + profiles.a, JSON.stringify(S));
  lset('neondrift:idx', JSON.stringify(profiles));
};

/* ========== Canvas ========== */
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

/* ========== Audio ========== */
let AC;
function playTone(freq, dur = 0.08, type = 'square', vol = 0.04) {
  if (S.mute) return;
  try {
    AC = AC || new AudioContext();
    const osc = AC.createOscillator(), gain = AC.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    osc.connect(gain); gain.connect(AC.destination);
    osc.start(); osc.stop(AC.currentTime + dur);
  } catch {}
}

/* ========== World ========== */
const CHUNK = 512;
const BIOMES = [
  { n: 'Neon Flats', bg: '#0d0b24', ob: '#19e6ff', gr: '#1a1650' },
  { n: 'Magma Grid', bg: '#1e0a0f', ob: '#ff6a2b', gr: '#3a1218' },
  { n: 'Toxic Bloom', bg: '#07190f', ob: '#7dff3a', gr: '#0f3a1c' },
  { n: 'Void Glass', bg: '#140a24', ob: '#d46bff', gr: '#2a1450' }
];
let seed = '', rng = Math.random, chunks = new Map();

const biomeAt = (x, y) => BIOMES[hashStr(seed + 'b' + Math.floor(x / 1536) + ',' + Math.floor(y / 1536)) % 4];

function getChunk(cx, cy) {
  const key = (cx + 4096) * 8192 + cy + 4096;
  let c = chunks.get(key);
  if (c) return c;
  const r = mulberry(hashStr(seed + 'c' + cx + ',' + cy));
  const n = 3 + (r() * 5 | 0);
  c = { cx, cy, o: [] };
  for (let i = 0; i < n; i++) {
    const x = cx * CHUNK + r() * CHUNK;
    const y = cy * CHUNK + r() * CHUNK;
    const rad = 18 + r() * 40;
    if (Math.hypot(x, y) > rad + 190) c.o.push({ x, y, r: rad });
  }
  chunks.set(key, c);
  return c;
}

function pushOut(entity) {
  const cx = Math.floor(entity.x / CHUNK), cy = Math.floor(entity.y / CHUNK);
  for (let i = -1; i <= 1; i++)
    for (let j = -1; j <= 1; j++) {
      const obs = getChunk(cx + i, cy + j).o;
      for (let k = 0; k < obs.length; k++) {
        const a = obs[k];
        const dx = entity.x - a.x, dy = entity.y - a.y;
        const min = a.r + entity.r, d2 = dx * dx + dy * dy;
        if (d2 < min * min) {
          const d = Math.sqrt(d2) || 1;
          entity.x = a.x + dx / d * min;
          entity.y = a.y + dy / d * min;
        }
      }
    }
}

/* ========== Content tables ========== */
// k = index in ENEMY. minT = seconds until it can spawn, w = spawn weight.
// ai / death name entries in AI / DEATH below. boss: spawned only by the boss timer.
const ENEMY = [
  /* 0 */ { name: 'Chaser',   ai: 'chase',   hp: 18,  s: 62,  r: 10, d: 8,  c: '#ff2bd6', minT: 0,   w: 1 },
  /* 1 */ { name: 'Swarmer',  ai: 'chase',   hp: 8,   s: 110, r: 7,  d: 5,  c: '#ffd02b', minT: 28,  w: 1 },
  /* 2 */ { name: 'Tank',     ai: 'chase',   hp: 90,  s: 40,  r: 18, d: 14, c: '#ff6a2b', minT: 56,  w: 1, gem: 3 },
  /* 3 */ { name: 'Shooter',  ai: 'shooter', hp: 26,  s: 50,  r: 10, d: 6,  c: '#b36bff', minT: 150,  w: 1 },
  /* 4 */ { name: 'Splitter', ai: 'chase',   hp: 40,  s: 55,  r: 14, d: 9,  c: '#7dff3a', minT: 112, w: 1, death: 'split' },
  /* 5 */ { name: 'Boss',     ai: 'boss',    hp: 900, s: 50,  r: 42, d: 20, c: '#ff2b4a', boss: true, gem: 2, gems: 10, death: 'boss' },
  /* 6 */ { name: 'Blinker',  ai: 'blinker', hp: 22,  s: 70,  r: 9,  d: 7,  c: '#00e5ff', minT: 200, w: 1 },
  /* 7 */ { name: 'Orbiter',  ai: 'orbiter', hp: 28,  s: 80,  r: 11, d: 6,  c: '#c77dff', minT: 240, w: 1 }
];
const SPAWNABLE = ENEMY.map((_, i) => i).filter(i => !ENEMY[i].boss);
const PACK_LIFE = 20;   // seconds a health pack stays on the field (no hoarding)

const moveToward = (e, tx, ty, speed, dt) => {
  const dx = tx - e.x, dy = ty - e.y, d = len(dx, dy);
  e.x += dx / d * speed * dt;
  e.y += dy / d * speed * dt;
};
const angleTo = (e, t) => Math.atan2(t.y - e.y, t.x - e.x);
const fire = (e, angle, speed, dmg, life = 5) => eBullets.push({
  x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, d: dmg * (e.dm || 1), l: life
});

function makeEnemy(k, x, y, hp) {
  const t = ENEMY[k];
  return { id: ++enemySeq, k, boss: !!t.boss, x, y, r: t.r, hp, mh: hp, s: t.s, d: t.d, c: t.c,
           cd: 2 + rng(), fl: 0, oc: 0, lb: null };
}

/* AI behaviours: (enemy, dt, target) -> void. Add a new enemy = one ENEMY row + (optionally) one AI entry. */
const AI = {
  chase(e, dt, t) { moveToward(e, t.x, t.y, e.s, dt); },

  shooter(e, dt, t) {
    const d = len(t.x - e.x, t.y - e.y);
    moveToward(e, t.x, t.y, d < 200 ? -e.s * 0.7 : d < 260 ? 0 : e.s, dt);   // keep distance
    if ((e.cd -= dt) <= 0 && d < 460) { e.cd = 2.4; fire(e, angleTo(e, t), 190, 5); }
  },

  boss(e, dt, t) {
    moveToward(e, t.x, t.y, e.s, dt);
    if ((e.cd -= dt) > 0) return;
    e.cd = 2.6;
    const a0 = angleTo(e, t);
    for (let j = 0; j < 14; j++) fire(e, a0 + j * 6.283 / 14, 150, 10);   // ring
    for (let j = -1; j <= 1; j++) fire(e, a0 + j * 0.18, 260, 12);        // aimed fan
    playTone(70, 0.3, 'sawtooth', 0.08);
  },

  blinker(e, dt, t) {
    moveToward(e, t.x, t.y, e.s * 0.35, dt);                  // slow drift while charging
    if ((e.cd -= dt) > 0) return;
    const d = len(t.x - e.x, t.y - e.y);
    if (d > 140) {                                            // blink toward target, never through it
      moveToward(e, t.x, t.y, Math.min(90 + rng() * 70, d - 60), 1);
      e.cd = 1.2 + rng() * 0.5;
    } else e.cd = 0.3;                                        // too close: retry shortly
  },

  orbiter(e, dt, t) {
    const R = 210;
    if (e.ang === undefined) e.ang = Math.atan2(e.y - t.y, e.x - t.x);   // start on current bearing
    e.ang += e.s * 0.9 / R * dt;                                           // slower than it can fly
    moveToward(e, t.x + Math.cos(e.ang) * R, t.y + Math.sin(e.ang) * R, e.s * 1.6, dt);
    if ((e.cd -= dt) <= 0) { e.cd = 2.2; fire(e, angleTo(e, t), 200, 5, 4); }
  }
};

const DEATH = {
  split(e) { for (let i = 0; i < 2; i++) enemies.push(makeEnemy(1, e.x + i * 12, e.y, ENEMY[1].hp)); },
  boss() { bossCount++; S.bosses++; S.shards += TUNE.bossShards(bossCount); }
};

/* ========== Scaling: every curve in one place. t = seconds survived, lv = player level, n = bosses killed ========== */
const TUNE = {
  xpNeed:      lv => Math.floor(3 + lv * 2 + lv * lv * 0.4),             // XP needed to go from level lv to lv + 1
  passiveGain: n  => Math.pow(0.92, n - 1),                               // diminishing returns on stacked passives
  spawnRate:   t  => 1 + t / 90 + Math.pow(Math.max(0, t - 600) / 300, 2),   // enemies per second
  hpMult:      t  => 1 + t / 200 + Math.pow(Math.max(0, t - 480) / 360, 2),  // regular enemy HP multiplier
  speedMult:   t  => 1 + Math.min(0.8, Math.max(0, t - 300) / 1200),      // enemies speed up to +80%
  eliteChance: t  => Math.min(0.4, Math.max(0, t - 200) / 2400),          // elites: 4x HP, bigger, 3x XP
  enemyCap:    t  => 420,
  bossAt:      n  => 150 * (n + 1),
  bossHp:      n  => 1 + n * 0.8 + n * n * 0.1,
  dmgMult:     t  => 1 + Math.max(0, t - 360) / 360,                      // enemy contact + bullet damage: the late-game ceiling
  bossShards:  n  => 10 + 2 * n
};

  { id: 'bolt', n: 'Plasma Bolt', d: 'Auto-fires at nearest foe' },

  bolt:  { p: 'dmg',  id: 'evo_bolt',  n: 'Railgun',        d: 'Bolt: +2 shots, pierces everything' },

  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, name: activeName(), d: data }))));
  return 'ND1.' + b64 + '.' + hashStr(b64).toString(36);
}

function decodeProfile(code) {
  const m = /^ND1\.([A-Za-z0-9+/=]+)\.([0-9a-z]+)$/.exec(String(code).replace(/\s+/g, ''));
  if (!m || hashStr(m[1]).toString(36) !== m[2]) throw Error('Code is incomplete or corrupted.');
  const o = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
  if (!o || o.v !== 1 || !o.d) throw Error('Unsupported code version.');
  return o;
}

/* ========== Run lifecycle ========== */
/* One player's whole build + state. players[] holds every player; `player` is the local one.
   Non-local players are driven through p.input = {dx, dy} (network peer, bot, test). */
function makePlayer(idx, ch) {
  const u = S.up;
  const p = {
    idx, isP: true, input: { dx: 0, dy: 0 },
    x: 0, y: 0, r: 12,
    hp: 100 + 15 * u.hp, mhp: 100 + 15 * u.hp,
    spd: 170 * (1 + 0.05 * u.spd),
    dmg: 1 + 0.08 * u.dmg, rate: 1,
    mag: 70 * (1 + 0.15 * u.mag),
    w: { bolt: 1, orb: 0, nova: 0, arc: 0, mine: 0, shard: 0 },
    pc: {}, evo: {}, area: 1, regen: 0, acd: 1, mcd: 1, scd: 1,
    cd: 0, ncd: 2, ang: 0, iv: 0
  };
  const c = CHAR[idx === 0 ? effChar() : clamp(ch | 0, 0, CHAR.length - 1)];      // character + mutator modifiers
  Object.assign(p.w, c.w); c.mod(p);
  if (mutOn(0)) { p.dmg *= 2; p.mhp = Math.round(p.mhp / 2); }
  p.hp = p.mhp;
  return p;
}

function start(sd) {
  seed = cleanSeed(sd) || '0';
  runSeed = seed;
  rng = mulberry(hashStr(seed + 'g'));
  chunks = new Map();
  runMut = /^D\d{4}-/.test(seed) ? dailyMask(seed) : S.mut;   // daily challenge uses fixed mutators
  lastSec = 0;
  players = [player = makePlayer(0)];   // players[0] is the local player
  enemies = []; bullets = []; eBullets = []; gems = []; packs = []; rings = []; arcs = []; mines = [];
  time = 0; kills = 0; level = 1; xp = 0; xpNext = 5;
  spawnAcc = 0; bossCount = 0; gcTimer = 0;
  cam = { x: 0, y: 0 };
  trail.length = 0;
  initBot(); startMusic(); hide(); state = 'play';
  playTone(440, 0.15, 'sawtooth');
}

function gameOver() {
  if (net && net.role !== 'solo') return coopGameOver();
  state = 'over';
  checkAch();
  const earn = Math.floor((time / 6 + kills / 8) * mutBonus());
  S.shards += earn; S.runs++; S.kills += kills;
  S.best = Math.max(S.best, time | 0);
  if (/^D\d{4}-/.test(runSeed))
    S.daily[runSeed.slice(1)] = Math.max(S.daily[runSeed.slice(1)] || 0, time | 0);
  save(); stopMusic();
  const code = btoa(JSON.stringify({ s: runSeed, t: time | 0, k: kills, l: level }));
  playTone(120, 0.5, 'sawtooth', 0.08);
  show(`<h2>Run over</h2>
    <p>${time | 0}s · ${kills} kills · level ${level}</p>
    <p class=b>${(time | 0) >= S.best ? 'New best!' : `Best ${S.best}s`}</p>
    <p class=b>+${earn}◆ shards${runMut ? ' (mutators ×' + mutBonus().toFixed(2) + ')' : ''}</p>
    <p>Share code:</p>
    <input id=cd readonly value="${code}" onclick="this.select()">
    <button onclick="copyShare()">Copy link</button>
    <button onclick="start('${runSeed}')">Retry seed</button>
    <button onclick="start(''+Date.now())">New run</button>
    <button onclick="shopScreen()">Shop</button>
    <button onclick="titleScreen()">Title</button>`);
}

function copyShare() {
  const url = location.href.split('#')[0] + '#r=' + $('cd').value;
  try { navigator.clipboard.writeText(url); } catch {}
  $('cd').select();
}

function pickType() {
  let total = 0;
  for (const i of SPAWNABLE) if (time >= ENEMY[i].minT) total += ENEMY[i].w;
  let r = rng() * total;
  for (const i of SPAWNABLE) {
    if (time < ENEMY[i].minT) continue;
    if ((r -= ENEMY[i].w) < 0) return i;
  }
  return 0;
}

function spawnEnemy(isBoss) {
  const a = rng() * 6.283;
  const R = Math.hypot(W, H) / 2 + 60;
  const k = isBoss ? ENEMY.findIndex(t => t.boss) : pickType();   // regular spawns can never be a boss
  const t = ENEMY[k];
  const hp = isBoss ? t.hp * TUNE.bossHp(bossCount) * crowd(0.5) : t.hp * TUNE.hpMult(time) * (mutOn(5) ? 1.5 : 1) * crowd(0.25);
  const sp = players.length > 1 ? players[(rng() * players.length) | 0] : player;   // spawn around a random player
  const e = makeEnemy(k, sp.x + Math.cos(a) * R, sp.y + Math.sin(a) * R, hp);
  if (!isBoss) {
    e.s *= TUNE.speedMult(time) * (mutOn(2) ? 1.25 : 1);
    if (rng() < Math.min(0.6, TUNE.eliteChance(time) * (mutOn(3) ? 3 : 1))) { e.elite = true; e.hp = e.mh = hp * 4; e.r *= 1.25; e.s *= 1.1; }   // elite: tougher, bigger, 3x XP
  }
  e.dm = TUNE.dmgMult(time); e.d *= e.dm;                   // enemies hit harder over time (contact and bullets)
  enemies.push(e);
}

function killEnemy(e) {
  kills++;
  const t = ENEMY[e.k];
  for (let i = 0; i < (t.gems || 1); i++)
    gems.push({
      x: e.x + (i ? (rnd01() - 0.5) * 60 : 0),
      y: e.y + (i ? (rnd01() - 0.5) * 60 : 0),
      v: (t.gem || 1) * (e.elite ? 3 : 1)
    });
  if (t.death) DEATH[t.death](e);
  if (!e.boss && rng() < 0.025) packs.push({ x: e.x, y: e.y, life: PACK_LIFE });
  playTone(180 + rnd01() * 60, 0.05, 'triangle', 0.03);
}

function damage(e, d) { e.hp -= d; e.fl = 0.07; }

function levelUp() {
  if (net && net.role === 'host') return coopLevelUp();      // co-op: everyone picks, nobody pauses
  level++; xp -= xpNext; xpNext = TUNE.xpNeed(level);
  player.mhp += 3; player.hp = Math.min(player.mhp, player.hp + player.mhp * 0.1);   // small heal + HP per level
  const owned = Object.keys(player.w).filter(k => player.w[k] > 0).length;
  const pool = UPGRADES.filter(u => u.p || (player.w[u.id] < 6 && (player.w[u.id] > 0 || owned < MAX_WEAPONS)));
  const evos = Object.keys(EVO).filter(k => player.w[k] >= 6 && !player.evo[k] && (player.pc[EVO[k].p] || 0) >= 2)
    .map(k => ({ ...EVO[k], evo: 1 }));
  const picks = evos.slice(0, 1);
  while (picks.length < 3 && pool.length)
    picks.push(pool.splice(rng() * pool.length | 0, 1)[0]);
  choices = picks;
  state = 'pick';
  playTone(880, 0.2, 'sine', 0.06);
  show(`<h2>Level ${level}</h2>` +
    picks.map((u, i) =>
      `<button onclick="pickUpgrade('${u.id}')">${i + 1}. ${u.n}${u.p ? '' : u.evo ? ' ★ EVOLUTION' : player.w[u.id] ? ' → Lv' + (player.w[u.id] + 1) : ' (NEW)'}
        <br><small>${u.d}</small></button>`
    ).join(''));
}

function applyUpgrade(p, id) {
  const up = UPGRADES.find(u => u.id === id);
  if (up && up.p) p.pc[id] = (p.pc[id] || 0) + 1;
  if (id.startsWith('evo_')) p.evo[id.slice(4)] = 1;
  else if (id === 'area') p.area *= 1 + 0.15 * TUNE.passiveGain(p.pc.area);
  else if (id === 'regen') p.regen += 0.4;
  if (p.w[id] !== undefined) p.w[id]++;
  else if (id === 'spd') p.spd *= 1 + 0.12 * TUNE.passiveGain(p.pc.spd);
  else if (id === 'dmg') p.dmg *= 1 + 0.2 * TUNE.passiveGain(p.pc.dmg);
  else if (id === 'rate') p.rate *= 1 + 0.15 * TUNE.passiveGain(p.pc.rate);
  else if (id === 'hp') { p.mhp += 25; p.hp = Math.min(p.mhp, p.hp + 25); }
  else if (id === 'mag') p.mag *= 1 + 0.4 * TUNE.passiveGain(p.pc.mag);
}

function pickUpgrade(id) {
  if (state !== 'pick') return;
  applyUpgrade(player, id);
  hide(); state = 'play';
}

/* ========== Simulation ========== */
function buildGrid() {
  gridOx = player.x - GRID_N * GRID / 2;
  gridOy = player.y - GRID_N * GRID / 2;
  for (let i = 0; i < grid.length; i++) grid[i].length = 0;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const gx = ((e.x - gridOx) / GRID) | 0;
    const gy = ((e.y - gridOy) / GRID) | 0;
    if (gx >= 0 && gy >= 0 && gx < GRID_N && gy < GRID_N) grid[gy * GRID_N + gx].push(e);
  }
}

const hitBuf = [];   // reused result buffer: no closures / allocations in the hot path
function nearEnemies(x, y, r) {
  hitBuf.length = 0;
  const gx = ((x - gridOx) / GRID) | 0;
  const gy = ((y - gridOy) / GRID) | 0;
  for (let j = gy - 1; j <= gy + 1; j++)
    for (let i = gx - 1; i <= gx + 1; i++) {
      if (i < 0 || j < 0 || i >= GRID_N || j >= GRID_N) continue;
      const cell = grid[j * GRID_N + i];
      for (let k = 0; k < cell.length; k++) {
        const e = cell[k];
        if (e.hp > 0 && Math.hypot(e.x - x, e.y - y) < e.r + r) hitBuf.push(e);
      }
    }
  return hitBuf;
}

/* Closest living player to a point (falls back to the local player if everyone is down). */
function nearestPlayer(x, y) {
  let best = null, bd = Infinity;
  for (const p of players) {
    if (p.hp <= 0 || p.afk) continue;
    const d = dist2(p.x, p.y, x, y);
    if (d < bd) { bd = d; best = p; }
  }
  return best || player;
}
/* Enemies chase the nearest player, or the AI bot when it is closer. */
function nearestTarget(e) {
  const p = nearestPlayer(e.x, e.y);
  return bot && !bot.down && dist2(bot.x, bot.y, e.x, e.y) < dist2(p.x, p.y, e.x, e.y) ? bot : p;
}

function fireBolt(p, dt) {
  p.cd -= dt;
  const boltLv = p.w.bolt;
  if (boltLv && p.cd <= 0) {
    let best = null, bestD = 1e9;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i], d = dist2(e.x, e.y, p.x, p.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    if (best && bestD < 640000) {
      const evB = p.evo.bolt, n = 1 + (boltLv >= 3) + (boltLv >= 5) + (evB ? 2 : 0);
      const a = Math.atan2(best.y - p.y, best.x - p.x);
      for (let i = 0; i < n; i++) {
        const aa = a + (i - (n - 1) / 2) * 0.14;
        bullets.push({
          x: p.x, y: p.y,
          vx: Math.cos(aa) * 520, vy: Math.sin(aa) * 520,
          d: 14 * p.dmg * (1 + 0.18 * (boltLv - 1)),
          p: evB ? 99 : boltLv >= 4 ? 2 : 0, l: 1.2
        });
      }
      p.cd = Math.max(0.12, 0.5 / p.rate - 0.04 * boltLv);
      playTone(520, 0.04, 'square', 0.015);
    } else p.cd = 0.1;
  }

}

function updateWeapons(p, dt) {
  p.ang += 3 * dt;
  if (p.w.orb) {
    const n = orbCount(p), R = orbRadius(p);
    for (let i = 0; i < n; i++) {
      const a = p.ang + i * 6.283 / n;
      const x = p.x + Math.cos(a) * R, y = p.y + Math.sin(a) * R;
      const hits = nearEnemies(x, y, 10);
      for (let h = 0; h < hits.length; h++) {
        const e = hits[h];
        if (e.oc > 0) continue;
        damage(e, 12 * p.dmg * (1 + 0.15 * p.w.orb));
        e.oc = 0.35;
      }
    }
  }

  if (p.w.nova) {
    p.ncd -= dt;
    if (p.ncd <= 0) {
      const m = (90 + 25 * p.w.nova) * p.area * (p.evo.nova ? 1.5 : 1);
      rings.push({ x: p.x, y: p.y, r: 0, m });
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (Math.hypot(e.x - p.x, e.y - p.y) < m + e.r)
          damage(e, 40 * p.dmg * (1 + 0.15 * p.w.nova));
      }
      p.ncd = Math.max(1.5, 4 - 0.35 * p.w.nova) * (p.evo.nova ? 0.6 : 1);
      playTone(90, 0.25, 'sine', 0.08);
    }
  }

  if (p.w.arc) {                                      // Chain Lightning
    const lv = p.w.arc, ev = p.evo.arc;
    if ((p.acd -= dt) <= 0) {
      let best = null, bd = 160000;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i], d = dist2(e.x, e.y, p.x, p.y);
        if (e.hp > 0 && d < bd) { bd = d; best = e; }
      }
      if (best) {
        const links = 2 + lv + (ev ? lv : 0), dmg = 12 * p.dmg * (1 + 0.18 * (lv - 1));
        const hit = new Set();                             // one small allocation per cast
        let cur = best, px = p.x, py = p.y;
        for (let n = 0; n < links && cur; n++) {
          damage(cur, dmg); hit.add(cur);
          arcs.push({ x1: px, y1: py, x2: cur.x, y2: cur.y, l: 0.18 });
          px = cur.x; py = cur.y;
          let nx = null, nd = 22500 * p.area;         // 150 px chain range
          for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (e.hp <= 0 || hit.has(e)) continue;
            const d = dist2(e.x, e.y, px, py);
            if (d < nd) { nd = d; nx = e; }
          }
          cur = nx;
        }
        playTone(900, 0.06, 'sawtooth', 0.02);
      }
      p.acd = Math.max(0.35, 1.5 / p.rate - 0.1 * lv) * (ev ? 0.6 : 1);
    }
  }

  if (p.w.mine) {                                     // Proximity Mines
    const lv = p.w.mine, ev = p.evo.mine;
    if ((p.mcd -= dt) <= 0) {
      for (let k = 0; k < (ev ? 3 : 1); k++)
        mines.push({ x: p.x + (k ? (rng() - 0.5) * 120 : 0), y: p.y + (k ? (rng() - 0.5) * 120 : 0), t: 0.6, l: 10, o: p });
      p.mcd = Math.max(1.2, 3 / p.rate - 0.2 * lv);
    }
    const rad = (60 + 8 * lv) * p.area * (ev ? 1.3 : 1);
    for (let i = mines.length - 1; i >= 0; i--) {
      const m = mines[i];
      if (m.o !== p) continue;            // every owner updates only its own mines
      m.t -= dt; m.l -= dt;
      const boom = m.l <= 0 || (m.t <= 0 && nearEnemies(m.x, m.y, 26).length > 0);
      if (!boom) continue;
      rings.push({ x: m.x, y: m.y, r: 0, m: rad });
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (Math.hypot(e.x - m.x, e.y - m.y) < rad + e.r) damage(e, 35 * p.dmg * (1 + 0.2 * (lv - 1)));
      }
      playTone(120, 0.15, 'square', 0.05);
      mines[i] = mines[mines.length - 1]; mines.pop();
    }
  }

  if (p.w.shard) {                                    // Scatter Shards
    const lv = p.w.shard, ev = p.evo.shard;
    if ((p.scd -= dt) <= 0) {
      let best = null, bd = 140000;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i], d = dist2(e.x, e.y, p.x, p.y);
        if (d < bd) { bd = d; best = e; }
      }
      if (best) {
        const a = Math.atan2(best.y - p.y, best.x - p.x), n = (3 + lv) * (ev ? 2 : 1);
        for (let i = 0; i < n; i++) {
          const aa = a + (i / (n - 1) - 0.5) * (0.9 + 0.05 * n);
          bullets.push({ x: p.x, y: p.y, vx: Math.cos(aa) * 600, vy: Math.sin(aa) * 600,
                         d: 7 * p.dmg * (1 + 0.15 * (lv - 1)), p: 0, l: ev ? 0.55 : 0.4 });
        }
        playTone(300, 0.05, 'triangle', 0.02);
      }
      p.scd = Math.max(0.5, 1.3 / p.rate - 0.08 * lv);
    }
  }

}

function tick(dt) {
  time += dt; gcTimer += dt;
  if (net && net.role === 'host') netTick(dt);               // co-op: pick timeouts + snapshots
  if ((time | 0) !== lastSec) { lastSec = time | 0; checkAch(); }   // achievements are checked once per second

  for (const p of players) {
    let ix, iy;
    if (p === player) {                     // local player: keyboard + touch stick
      ix = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
      iy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
      if (joy) { ix += joy.dx; iy += joy.dy; }
    } else { ix = p.input.dx; iy = p.input.dy; }   // remote / scripted players
    const [nx, ny] = p.hp > 0 ? limit(ix, iy) : [0, 0];
    p.x += nx * p.spd * dt;
    p.y += ny * p.spd * dt;
    pushOut(p);
    p.iv -= dt;
    if (p.hp > 0) p.hp = Math.min(p.mhp, p.hp + (mutOn(4) ? 0 : p.regen) * dt);   // a downed player does not regenerate back up
  }
  cam.x += (player.x - cam.x) * 0.12;
  cam.y += (player.y - cam.y) * 0.12;

  if (gcTimer > 5) {
    gcTimer = 0;
    for (const [k, c] of chunks) {
      let keep = false;
      for (const p of players)
        if (Math.abs(c.cx - Math.floor(p.x / CHUNK)) <= 4 && Math.abs(c.cy - Math.floor(p.y / CHUNK)) <= 4) { keep = true; break; }
      if (!keep) chunks.delete(k);
    }
  }

  spawnAcc += dt * TUNE.spawnRate(time) * (mutOn(1) ? 1.5 : 1) * crowd(0.6);
  while (spawnAcc >= 1) {
    spawnAcc--;
    if (enemies.length < TUNE.enemyCap(time) + 80 * (crowd(1) - 1)) spawnEnemy(false);
  }
  if (time >= TUNE.bossAt(bossCount) && !enemies.some(e => e.boss)) spawnEnemy(true);

  buildGrid();

  // Player weapons (each player fires independently)
  for (const p of players) if (p.hp > 0) fireBolt(p, dt);

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt;
    let remove = b.l <= 0;
    if (!remove) {
      const hits = nearEnemies(b.x, b.y, 4);
      for (let h = 0; h < hits.length; h++) {
        const e = hits[h];
        if (e.lb === b) continue;
        e.lb = b; damage(e, b.d);
        if (--b.p < 0) { remove = true; break; }
      }
    }
    if (remove) { bullets[i] = bullets[bullets.length - 1]; bullets.pop(); }
  }

  for (const p of players) if (p.hp > 0) updateWeapons(p, dt);
  for (let i = arcs.length - 1; i >= 0; i--) if ((arcs[i].l -= dt) <= 0) arcs.splice(i, 1);

  // Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0) {
      killEnemy(e);
      enemies[i] = enemies[enemies.length - 1];
      enemies.pop();
      continue;
    }
    e.fl -= dt;
    e.oc -= dt;

    const target = nearestTarget(e);

    AI[ENEMY[e.k].ai](e, dt, target);
    pushOut(e);

    // Keep far-away enemies from drifting forever
    const d = Math.hypot(target.x - e.x, target.y - e.y);
    if (d > 1500) {
      const a = rng() * 6.283, np = nearestPlayer(e.x, e.y);
      e.x = np.x + Math.cos(a) * (Math.hypot(W, H) / 2 + 60);
      e.y = np.y + Math.sin(a) * (Math.hypot(W, H) / 2 + 60);
    }

    // Contact damage (only vs player when targeted)
    if (target.isP && d < e.r + target.r && target.iv <= 0) {
      target.hp -= e.d;
      target.iv = 0.6;
      playTone(110, 0.12, 'sawtooth', 0.07);
    }
  }

  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt;
    let remove = b.l <= 0;
    for (const p of players)
      if (p.hp > 0 && p.iv <= 0 && Math.hypot(b.x - p.x, b.y - p.y) < p.r + 5) { p.hp -= b.d; p.iv = 0.4; remove = true; break; }
    if (remove) { eBullets[i] = eBullets[eBullets.length - 1]; eBullets.pop(); }
  }

  for (let i = gems.length - 1; i >= 0; i--) {
    const m = gems[i];
    const p = nearestPlayer(m.x, m.y);       // XP is a shared pool; the nearest player collects
    const dx = p.x - m.x, dy = p.y - m.y, d = len(dx, dy);
    if (d < p.mag) { m.x += dx / d * 340 * dt; m.y += dy / d * 340 * dt; }
    if (d < p.r + 6) {
      xp += m.v;
      gems[i] = gems[gems.length - 1]; gems.pop();
      playTone(1200, 0.03, 'sine', 0.02);
    }
  }

  for (let i = packs.length - 1; i >= 0; i--) {
    if ((packs[i].life -= dt) <= 0) { packs.splice(i, 1); continue; }
    const pk = packs[i], p = players.find(q => q.hp > 0 && Math.hypot(q.x - pk.x, q.y - pk.y) < 24);
    if (p) {
      p.hp = Math.min(p.mhp, p.hp + (mutOn(4) ? 15 : 30));
      packs.splice(i, 1);
      playTone(660, 0.15, 'sine', 0.06);
    }
  }

  for (let i = rings.length - 1; i >= 0; i--) {
    rings[i].r += 500 * dt;
    if (rings[i].r >= rings[i].m) rings.splice(i, 1);
  }

  botTick(dt);
  if (players.every(p => p.hp <= 0)) gameOver();
  else if (xp >= xpNext) levelUp();
}

/* ========== Render ========== */
function updateAndDrawTrail(ox, oy) {
  if (!player || state !== 'play') return;

  // Track the absolute coordinates of the player
  trail.unshift({ x: player.x, y: player.y });

  if (trail.length > maxTrailLength) {
    trail.pop();
  }

  // Draw fading history dots relative to the current camera view offset
  for (let i = 0; i < trail.length; i++) {
    const pt = trail[i];
    const alpha = 1 - (i / maxTrailLength);
    const radius = player.r * 0.75 * alpha; // Shrink smoothly towards the tail end

    g.beginPath();
    g.arc(pt.x + ox, pt.y + oy, radius, 0, 6.283);
    
    // Transparent layer matching the bright neon cyan style variable (--b)
    g.fillStyle = `rgba(25, 230, 255, ${alpha * 0.35})`; 
    g.fill();
  }
}

function draw() {
  if (!player) { g.fillStyle = '#0b0a1a'; g.fillRect(0, 0, W, H); return; }
  const biome = biomeAt(cam.x, cam.y);
  g.fillStyle = biome.bg; g.fillRect(0, 0, W, H);

  const ox = W / 2 - cam.x;
  const oy = H / 2 - cam.y;

  g.strokeStyle = biome.gr; g.globalAlpha = 0.55; g.lineWidth = 1; g.beginPath();
  for (let x = Math.floor((cam.x - W / 2) / 64) * 64; x < cam.x + W / 2 + 64; x += 64) {
    g.moveTo(x + ox, 0); g.lineTo(x + ox, H);
  }
  for (let y = Math.floor((cam.y - H / 2) / 64) * 64; y < cam.y + H / 2 + 64; y += 64) {
    g.moveTo(0, y + oy); g.lineTo(W, y + oy);
  }
  g.stroke(); g.globalAlpha = 1;

  const c0 = Math.floor((cam.x - W / 2) / CHUNK) - 1;
  const c1 = Math.floor((cam.x + W / 2) / CHUNK) + 1;
  const r0 = Math.floor((cam.y - H / 2) / CHUNK) - 1;
  const r1 = Math.floor((cam.y + H / 2) / CHUNK) + 1;
  for (let j = r0; j <= r1; j++)
    for (let i = c0; i <= c1; i++) {
      const obs = getChunk(i, j).o;
      for (let k = 0; k < obs.length; k++) {
        const a = obs[k], col = biomeAt(a.x, a.y).ob;
        g.globalAlpha = 0.18; g.fillStyle = col;
        g.beginPath(); g.arc(a.x + ox, a.y + oy, a.r, 0, 6.283); g.fill();
        g.globalAlpha = 1; g.strokeStyle = col; g.lineWidth = 2; g.stroke();
      }
    }

  updateAndDrawTrail(ox, oy);

  g.fillStyle = '#19e6ff';
  for (const m of gems) g.fillRect(m.x + ox - 3, m.y + oy - 3, 6, 6);
  g.fillStyle = '#4dff88';
  for (const p of packs) { if (p.life < 5 && ((p.life * 4) | 0) % 2) continue; g.beginPath(); g.arc(p.x + ox, p.y + oy, 8, 0, 6.283); g.fill(); }

  for (const e of enemies) {
  g.fillStyle = e.fl > 0 ? '#fff' : e.c;
  g.beginPath(); g.arc(e.x + ox, e.y + oy, e.r, 0, 6.283); g.fill();

  // Type-specific outline / ring
  g.lineWidth = 2;
  switch (e.k) {
    case 1: // fast
      g.strokeStyle = '#ffd02b88'; g.stroke(); break;
    case 2: // tank
      g.lineWidth = 3; g.strokeStyle = '#ff6a2b'; g.stroke(); break;
    case 3: // shooter
      g.strokeStyle = '#b36bff';
      g.beginPath(); g.arc(e.x + ox, e.y + oy, e.r * 0.55, 0, 6.283); g.stroke();
      break;
    case 4: // splitter
      g.strokeStyle = '#7dff3a'; g.stroke(); break;
    case 6: // blinker
      g.strokeStyle = e.cd < 0.35 ? '#fff' : '#80f0ff'; g.stroke(); break;
    case 7: // orbit
      g.strokeStyle = '#e0b0ff'; g.lineWidth = 1.5;
      g.beginPath(); g.arc(e.x + ox, e.y + oy, e.r + 5, 0, 6.283); g.stroke();
      break;
    }

    if (e.elite) { g.save(); g.strokeStyle = '#ffd02b'; g.lineWidth = 3; g.stroke(); g.restore(); }
    // Boss extras (unchanged)
    if (e.boss) {
      g.strokeStyle = e.cd < 0.6 ? '#fff' : '#ff2b4a'; g.lineWidth = 4; g.stroke();
      g.fillStyle = '#300'; g.fillRect(e.x + ox - 40, e.y + oy - e.r - 14, 80, 6);
      g.fillStyle = '#ff2b4a'; g.fillRect(e.x + ox - 40, e.y + oy - e.r - 14, 80 * Math.max(0, e.hp / e.mh), 6);
    }

    // Debug type number
    if (debug) {
      g.fillStyle = '#fff';
      g.font = '11px monospace';
      g.fillText(e.k, e.x + ox - 4, e.y + oy - e.r - 6);
    }
  }

  g.fillStyle = '#ffe66b';
  for (const q of bullets) { g.beginPath(); g.arc(q.x + ox, q.y + oy, 4, 0, 6.283); g.fill(); }
  g.fillStyle = '#ff4466';
  for (const q of eBullets) { g.beginPath(); g.arc(q.x + ox, q.y + oy, 5, 0, 6.283); g.fill(); }

  for (const p of players) if (p.w.orb) {
    const n = orbCount(p), R = orbRadius(p);
    g.fillStyle = '#fff';
    for (let i = 0; i < n; i++) {
      const a = p.ang + i * 6.283 / n;
      g.beginPath(); g.arc(p.x + ox + Math.cos(a) * R, p.y + oy + Math.sin(a) * R, 8, 0, 6.283); g.fill();
    }
  }

  g.lineWidth = 3;
  for (const r of rings) {
    g.globalAlpha = 1 - r.r / r.m; g.strokeStyle = '#19e6ff';
    g.beginPath(); g.arc(r.x + ox, r.y + oy, r.r, 0, 6.283); g.stroke();
  }
  g.globalAlpha = 1;
  g.save(); g.lineWidth = 2; g.strokeStyle = '#9fe8ff';
  for (const a of arcs) { g.globalAlpha = Math.min(1, a.l * 8); g.beginPath(); g.moveTo(a.x1 + ox, a.y1 + oy); g.lineTo(a.x2 + ox, a.y2 + oy); g.stroke(); }
  g.globalAlpha = 1;
  for (const m of mines) { g.strokeStyle = m.t > 0 ? '#887' : '#ffd02b'; g.beginPath(); g.arc(m.x + ox, m.y + oy, 7, 0, 6.283); g.stroke(); }
  g.restore();

  drawBot(ox, oy);

  g.shadowBlur = 18; g.shadowColor = '#19e6ff';
  for (const p of players) {
    g.fillStyle = p.iv > 0 && ((time * 20 | 0) % 2) ? '#fff' : (p.hp <= 0 ? '#555' : p === player ? '#19e6ff' : '#7dff3a');
    g.beginPath(); g.arc(p.x + ox, p.y + oy, p.r, 0, 6.283); g.fill();
    if (p.hp <= 0 && !p.gone && p.bleed !== undefined) {         // downed: revive progress ring + time left
      g.save(); g.strokeStyle = '#4dff88'; g.lineWidth = 3; g.shadowBlur = 0;
      g.beginPath(); g.arc(p.x + ox, p.y + oy, p.r + 6, -1.57, -1.57 + 6.283 * Math.min(1, (p.rv || 0) / 3)); g.stroke();
      g.fillStyle = '#fff'; g.font = '12px system-ui'; g.fillText(Math.ceil(p.bleed) + 's', p.x + ox - 8, p.y + oy - p.r - 10); g.restore();
    }
  }
  g.shadowBlur = 0;

  // HUD
  g.fillStyle = '#0008'; g.fillRect(10, 10, 200, 12);
  g.fillStyle = '#ff2b6a'; g.fillRect(10, 10, 200 * Math.max(0, player.hp / player.mhp), 12);
  g.fillStyle = '#0008'; g.fillRect(0, 0, W, 5);
  g.fillStyle = '#19e6ff'; g.fillRect(0, 0, W * Math.min(1, xp / xpNext), 5);
  g.fillStyle = '#e8e6ff'; g.font = '14px system-ui';
  g.fillText(`Lv ${level}  ·  ${time / 60 | 0}:${String(time % 60 | 0).padStart(2, '0')}  ·  ${kills} kills  ·  ${enemies.length} enemies ·  ${biome.n}`, 10, 40);
  g.fillText(`Bolt ${player.w.bolt}  Blades ${player.w.orb}  Nova ${player.w.nova}${player.w.arc ? '  Arc ' + player.w.arc : ''}${player.w.mine ? '  Mines ' + player.w.mine : ''}${player.w.shard ? '  Shards ' + player.w.shard : ''}`, 10, 58);
  if (bot) g.fillText(`Bot: ${bot.down ? 'DOWN - stand near to revive' : Math.ceil(bot.hp) + ' HP'}${botMsg ? ' · ' + botMsg : ''}`, 10, 76);
  if (joy) {
    g.strokeStyle = '#fff6'; g.lineWidth = 2;
    g.beginPath(); g.arc(joy.x, joy.y, 50, 0, 6.283); g.stroke();
    g.beginPath(); g.arc(joy.x + joy.dx * 50, joy.y + joy.dy * 50, 18, 0, 6.283); g.stroke();
  }
}

/* ========== Co-op bot ========== */
const DEFAULT_BOT = `function think(s){
  const me=s.me,p=s.player;let dx=0,dy=0;
  for(const e of s.enemies){const ex=me.x-e.x,ey=me.y-e.y,d=Math.hypot(ex,ey)||1;if(d<90+e.r){dx+=ex/d*(120-d)/60;dy+=ey/d*(120-d)/60}}
  for(const b of s.bullets){const bx=me.x-b.x,by=me.y-b.y,d=Math.hypot(bx,by)||1;if(d<110){dx+=bx/d;dy+=by/d}}
  const g=s.gems[0];if(g&&Math.hypot(g.x-p.x,g.y-p.y)<400){dx+=(g.x-me.x)*.01;dy+=(g.y-me.y)*.01}
  const pd=Math.hypot(p.x-me.x,p.y-me.y);if(pd>180){dx+=(p.x-me.x)/pd;dy+=(p.y-me.y)/pd}
  return{dx,dy}}`;

let bot = null, botCmd = { dx: 0, dy: 0 }, botFn = null, botWorker = null;
let botMem = {}, botPending = 0, botTime = 0, botMsg = '';

function botError(msg) {

}

function initBotMain(src) {
  try { botFn = new Function(src + '\nreturn think;')(); }
  catch (e) { botError(String(e)); }

function initBot() {
  if (botWorker) { botWorker.terminate(); botWorker = null; }
  bot = null; botMsg = ''; botFn = null;
  if (!S.bot) return;
  bot = { x: 30, y: 30, r: 12, hp: 100, mhp: 100, iv: 0, cd: 0, down: 0, rv: 0, th: 0 };
  botCmd = { dx: 0, dy: 0 }; botMem = {}; botPending = 0;
  const src = S.bot === 2 && S.script ? S.script : DEFAULT_BOT;
  try {
    const blob = new Blob([`let f;const mem={};onmessage=e=>{try{if(e.data.src){f=new Function(e.data.src+'\\nreturn think;')();return}const s=e.data;s.mem=mem;postMessage(f(s)||{})}catch(x){postMessage({err:String(x)})}}`], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    botWorker = new Worker(url);
    botWorker.onmessage = e => {
      botPending = 0;
      const c = e.data;
      if (c.err) botError(c.err); else botCmd = c;
    };
    botWorker.onerror = () => { botWorker = null; botPending = 0; initBotMain(src); };
    botWorker.postMessage({ src });
  } catch {
    botWorker = null; initBotMain(src);
  }

function botSnapshot() {
  const b = bot, en = [], gm = [], bl = [], ob = [];
  const cx = Math.floor(b.x / CHUNK), cy = Math.floor(b.y / CHUNK);
  const byDist = (a, c) => a.d - c.d;
  for (const e of enemies) {
    const d = Math.hypot(e.x - b.x, e.y - b.y);
    if (d < 600) en.push({ x: e.x | 0, y: e.y | 0, r: e.r, k: e.k, boss: !!e.boss, hp: e.hp | 0, d });
  }
  en.sort(byDist); en.length = Math.min(en.length, 40);
  for (const m of gems) {
    const d = Math.hypot(m.x - b.x, m.y - b.y);
    if (d < 500) gm.push({ x: m.x | 0, y: m.y | 0, d });
  }
  gm.sort(byDist); gm.length = Math.min(gm.length, 10);
  for (const q of eBullets) {
    const d = Math.hypot(q.x - b.x, q.y - b.y);
    if (d < 300) bl.push({ x: q.x | 0, y: q.y | 0, vx: q.vx | 0, vy: q.vy | 0, d });
  }
  bl.sort(byDist); bl.length = Math.min(bl.length, 20);
  for (let i = -1; i <= 1; i++)
    for (let j = -1; j <= 1; j++)
      for (const o of getChunk(cx + i, cy + j).o)
        if (Math.hypot(o.x - b.x, o.y - b.y) < 300)
          ob.push({ x: o.x | 0, y: o.y | 0, r: o.r | 0 });
  return {
    t: time,
    me: { x: b.x | 0, y: b.y | 0, hp: b.hp, mhp: b.mhp },
    player: { x: player.x | 0, y: player.y | 0, hp: player.hp, mhp: player.mhp },
    enemies: en, gems: gm, bullets: bl, obstacles: ob
  };
}

function botTick(dt) {
  const b = bot;
  if (!b) return;
  b.iv -= dt;
  if (b.down) {
    if (Math.hypot(player.x - b.x, player.y - b.y) < 36) {
      if ((b.rv += dt) >= 2) {
        b.down = 0; b.hp = b.mhp / 2; b.rv = 0; b.iv = 1.5;
        playTone(900, 0.2, 'sine', 0.06);
      }
    } else b.rv = Math.max(0, b.rv - dt);
    return;
  }
  if (botWorker && botPending && performance.now() - botTime > 300) {
    botPending = 0; botError('timed out');
  }
  b.th -= dt;
  if (b.th <= 0) {
    b.th = 0.05;
    const snap = botSnapshot();
    if (botWorker) {
      if (!botPending) { botPending = 1; botTime = performance.now(); botWorker.postMessage(snap); }
    } else if (botFn) {
      snap.mem = botMem;
      try { botCmd = botFn(snap) || botCmd; } catch (e) { botError(String(e)); }
    }
  }
  let dx = +botCmd.dx || 0, dy = +botCmd.dy || 0;
  const [ndx, ndy] = limit(dx, dy);
  b.x += ndx * player.spd * 0.9 * dt;
  b.y += ndy * player.spd * 0.9 * dt;
  pushOut(b);
  if (Math.hypot(player.x - b.x, player.y - b.y) > 1100) { b.x = player.x + 40; b.y = player.y; }

  b.cd -= dt;
  if (b.cd <= 0) {
    let best = null, bestD = 360000;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i], d = dist2(e.x, e.y, b.x, b.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    if (best) {
      const boltLv = player.w.bolt;
      const n = 1 + (boltLv >= 3) + (boltLv >= 5);
      const a0 = Number.isFinite(botCmd.aim) ? botCmd.aim : Math.atan2(best.y - b.y, best.x - b.x);
      for (let i = 0; i < n; i++) {
        const a = a0 + (i - (n - 1) / 2) * 0.14;
        bullets.push({
          x: b.x, y: b.y,
          vx: Math.cos(a) * 520, vy: Math.sin(a) * 520,
          d: 7 * player.dmg * (1 + 0.18 * (boltLv - 1)),
          p: boltLv >= 4 ? 2 : 0, l: 1.2
        });
      }
      b.cd = Math.max(0.18, 0.8 / player.rate - 0.04 * boltLv);
    } else b.cd = 0.1;
  }

  const touching = nearEnemies(b.x, b.y, b.r);
  if (touching.length && b.iv <= 0) { b.hp -= touching[0].d; b.iv = 0.6; }
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const q = eBullets[i];
    if (b.iv <= 0 && Math.hypot(q.x - b.x, q.y - b.y) < b.r + 5) {
      b.hp -= q.d; b.iv = 0.4;
      eBullets[i] = eBullets[eBullets.length - 1]; eBullets.pop();
    }
  }
  for (let i = gems.length - 1; i >= 0; i--) {
    const m = gems[i];
    const gx = b.x - m.x, gy = b.y - m.y, d = len(gx, gy);
    if (d < player.mag * 0.6) { m.x += gx / d * 300 * dt; m.y += gy / d * 300 * dt; }
    if (d < b.r + 6) {
      xp += m.v;
      gems[i] = gems[gems.length - 1]; gems.pop();
    }
  }
  if (b.hp <= 0) { b.hp = 0; b.down = 1; b.rv = 0; playTone(100, 0.3, 'sawtooth', 0.06); }
}

function drawBot(ox, oy) {

}

function noise(t, f, v, d, type) {
  const src = AC.createBufferSource(), filt = AC.createBiquadFilter(), gain = AC.createGain();
  src.buffer = music.nb; filt.type = type; filt.frequency.value = f;
  gain.gain.setValueAtTime(v, t); gain.gain.exponentialRampToValueAtTime(0.001, t + d);
  src.connect(filt); filt.connect(gain); gain.connect(music.gain);
  src.start(t); src.stop(t + d + 0.01);
}

let music = { iv: 0, step: 0, next: 0, rng: null, root: 40, prog: [0, 0, 0, 0], pat: [], gain: null, nb: null };

function startMusic() {
  stopMusic();
  try {
    AC = AC || new AudioContext();
    if (AC.state === 'suspended') AC.resume();
  } catch { return; }
  const r = mulberry(hashStr(seed + 'm'));
  music.rng = r; music.root = 36 + (r() * 12 | 0);
  music.prog = [0, 1, 2, 3].map(() => r() * 5 | 0);
  music.pat = Array.from({ length: 16 }, r);
  music.step = 0; music.next = AC.currentTime + 0.1;
  music.gain = AC.createGain(); music.gain.gain.value = 0.5; music.gain.connect(AC.destination);
  music.nb = AC.createBuffer(1, AC.sampleRate / 4 | 0, AC.sampleRate);
  const data = music.nb.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  music.iv = setInterval(musicSched, 50);
}

function stopMusic() {
  clearInterval(music.iv); music.iv = 0;
  if (music.gain) { try { music.gain.disconnect(); } catch {} music.gain = null; }
}

function tone(type, f, t, d, v, lp) {
  const osc = AC.createOscillator(), gain = AC.createGain();
  osc.type = type; osc.frequency.value = f;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(v, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + d);
  let node = osc;
  if (lp) {
    const filt = AC.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = lp;
    osc.connect(filt); node = filt;
  }
  node.connect(gain); gain.connect(music.gain);
  osc.start(t); osc.stop(t + d + 0.02);
}

function musicStep(t, intensity, boss, stepDur, G) {
  const r = music.rng, s = music.step & 15, bar = music.step >> 4, sc = G.sc;
  const tt = t + (s & 1 ? G.sw * stepDur : 0);
  if (s === 0 && r() < 0.5) music.pat[r() * 16 | 0] = r();
  const note = d => music.root + sc[((d % sc.length) + sc.length) % sc.length] + 12 * Math.floor(d / sc.length);
  const chord = music.prog[bar & 3];
  const hit = pat => pat[s] === '1' ? 1 : pat[s] === '2' ? 1.5 : 0;
  let v;
  if (v = hit(G.k)) {
    const osc = AC.createOscillator(), gain = AC.createGain();
    osc.frequency.setValueAtTime(140, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    gain.gain.setValueAtTime(0.45 * v, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    osc.connect(gain); gain.connect(music.gain); osc.start(t); osc.stop(t + 0.18);
  }
  if (v = hit(G.s)) noise(t, 1800, 0.14 * v, 0.12, 'bandpass');
  if ((v = hit(G.h)) && intensity >= G.ht) noise(tt, 7000, 0.09 * v, 0.04, 'highpass');
  if (v = hit(G.bs)) tone(G.bw, noteFreq(note(chord) + (G.bo || 0)), t, stepDur * (G.bd || 1.8), 0.15 * v, G.bl + intensity * (G.bf || 0));
  if (time >= G.at && music.pat[(s + bar * 5) & 15] < G.ad)
    tone(G.aw, noteFreq(note(chord + [0, 2, 4, 7, 9][(music.pat[(s * 3 + bar) & 15] * 5) | 0]) + 12 * G.ao), tt, stepDur * G.al, G.av, G.af);
  if (s === 0 && G.pv)
    for (let k = 0; k < 5; k += 2) tone(G.pw, noteFreq(note(chord + k) + 12), t, stepDur * 16, G.pv, 900);
  if (boss && s % 2 === 0) tone('sawtooth', noteFreq(note(chord) + 12), t, stepDur * 1.5, 0.06, 1200);
}

function musicSched() {
  if (!music.gain || !player) return;
  const now = AC.currentTime;
  if (S.mute || S.nm) { music.next = now + 0.1; return; }
  music.gain.gain.setTargetAtTime(state === 'play' ? 0.5 : 0.18, now, 0.15);
  if (music.next < now - 0.1) music.next = now + 0.05;
  const intensity = Math.min(1, enemies.length / 300 + time / 500);
  const boss = enemies.some(e => e.boss);
  const G = currentGenre(boss);
  const stepDur = 15 / (G.b[0] + (G.b[1] - G.b[0]) * intensity + (boss ? 10 : 0));
  while (music.next < now + 0.2) {
    musicStep(music.next, intensity, boss, stepDur, G);
    music.step++; music.next += stepDur;
  }
}

/* ========== Main loop & input ========== */
let acc = 0, last = 0;
/* ========== Multiplayer, stage M1: lobby + transport ==========
   Star topology: the host runs the simulation, clients connect to the host only.
   Transports share one interface (host/join/send/kick/close) so PeerJS can be swapped:
   peerTransport() = PeerJS over WebRTC, localTransport() = BroadcastChannel between tabs (testing). */
const NET_VER = 1, MP_MAX = 8;
const PEER_SRC = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const QR_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
let pendingRoom = '', mpMax = 4, mpLocal = false, net = null;
const roomCode = () => Array.from({ length: 5 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[(Math.random() * 31) | 0]).join('');
const cleanRoom = x => String(x).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);

const scriptCache = new Map();
const loadScript = src => {
  if (!scriptCache.has(src)) scriptCache.set(src, new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = () => { scriptCache.delete(src); rej(new Error('load ' + src)); };
    document.head.appendChild(el);
  }));
  return scriptCache.get(src);
};

function peerTransport() {
  let peer = null; const conns = new Map();
  const wire = (c, h, id) => { c.on('data', m => h.msg(id, m)); c.on('close', () => { conns.delete(id); h.close(id); }); c.on('error', () => {}); };
  return {
    async host(code, h) {
      try { if (typeof Peer === 'undefined') await loadScript(PEER_SRC); } catch { return h.error('net'); }
      peer = new Peer('neondrift-' + code);
      peer.on('open', () => h.ready());
      peer.on('error', e => h.error(e && e.type === 'unavailable-id' ? 'code-taken' : 'net'));
      peer.on('connection', c => c.on('open', () => { conns.set(c.peer, c); wire(c, h, c.peer); h.open(c.peer); }));
    },
    async join(code, h) {
      try { if (typeof Peer === 'undefined') await loadScript(PEER_SRC); } catch { return h.error('net'); }
      peer = new Peer();
      peer.on('error', e => h.error(e && e.type === 'peer-unavailable' ? 'no-room' : 'net'));
      peer.on('open', () => {
        const c = peer.connect('neondrift-' + code, { reliable: true, serialization: 'json' });
        c.on('open', () => { conns.set('host', c); wire(c, h, 'host'); h.ready(); });
      });
    },
    send(to, m) { const c = conns.get(to); if (c && c.open) c.send(m); },
    kick(id) { const c = conns.get(id); if (c) c.close(); },
    close() { conns.forEach(c => { try { c.close(); } catch {} }); conns.clear(); if (peer) peer.destroy(); peer = null; }
  };
}

function localTransport() {
  let ch = null, role = '', hh = null;
  const me = 'p' + Math.random().toString(36).slice(2, 8);
  return {
    async host(code, h) {
      role = 'host'; hh = h; ch = new BroadcastChannel('neondrift-' + code);
      ch.onmessage = e => {
        const m = e.data;
        if (m.k === 'hi') h.open(m.from); else if (m.k === 'bye') h.close(m.from); else if (m.k === 'd' && m.to === 'host') h.msg(m.from, m.d);
      };
      h.ready();
    },
    async join(code, h) {
      role = 'client'; hh = h; ch = new BroadcastChannel('neondrift-' + code);
      ch.onmessage = e => {
        const m = e.data;
        if (m.to !== me) return;
        if (m.k === 'd') h.msg('host', m.d); else if (m.k === 'bye') h.close('host');
      };
      ch.postMessage({ k: 'hi', from: me }); h.ready();
    },
    send(to, d) { if (ch) ch.postMessage(role === 'host' ? { k: 'd', to, from: 'host', d } : { k: 'd', to: 'host', from: me, d }); },
    kick(id) { if (ch) ch.postMessage({ k: 'bye', to: id }); },
    close() { if (ch) { if (role === 'client') ch.postMessage({ k: 'bye', from: me }); ch.close(); ch = null; } }
  };
}

function createNet(kind) {
  const n = { kind, role: 'solo', code: '', max: 4, idx: 0, lobby: [], status: '', tr: null, rtt: 0, last: 0, timer: 0,
              running: false, inGame: false, tries: 0, tok: '',
              onChange() {}, onStart() {}, onLost() {}, onMsg() {}, onLate() {}, onRejoin() {}, onAway() {} };
  const now = () => performance.now();
  const sendTo = (id, m) => { if (n.tr) n.tr.send(id, m); };
  const free = () => { for (let i = 1; i < n.max; i++) if (!n.lobby.some(p => p.idx === i)) return i; return -1; };
  const pub = () => n.lobby.map(p => ({ idx: p.idx, name: p.name, ping: p.ping }));
  const cast = () => { for (const p of n.lobby) if (p.id !== 'host') sendTo(p.id, { t: 'lobby', list: pub(), max: n.max, code: n.code }); n.onChange(); };
  const nameOf = v => String(v || 'Player').replace(/[^\w \-.]/g, '').trim().slice(0, 16) || 'Player';
  const removeEntry = e => {                                       // a player leaves for good
    const i = n.lobby.indexOf(e); if (i < 1) return;
    if (e.player) { e.player.hp = 0; e.player.gone = true; const k = players.indexOf(e.player); if (k > 0) players.splice(k, 1); }
    n.lobby.splice(i, 1); cast();
  };
  const drop = id => {                                           // connection lost: mid-run players keep their slot for 60 s
    const e = n.lobby.find(p => p.id === id); if (!e || e === n.lobby[0]) return;

}
/* ========== Multiplayer, stage M3: co-op rules ========== */
function crowd(k) { let n = 0; for (const p of players) if (!p.gone && !p.dead) n++; return 1 + k * (Math.max(1, n) - 1); }   // scaling with player count; exactly 1 solo
function netToast(text) {
  const t = $('toast'); t.innerHTML = esc(text); t.style.display = 'block';
  if (typeof setTimeout === 'function') setTimeout(() => { t.style.display = 'none'; }, 3000);
}
/* A downed player (HP 0) can be revived by a teammate standing next to them for 3 s; after 45 s they are out for the run. */
function reviveTick(dt) {
  for (const p of players) {
    if (p.afk) p.iv = Math.max(p.iv, 0.5);                       // a disconnected player cannot be hurt while away
    if (p.hp > 0 || p.gone || p.dead) continue;
    p.bleed = (p.bleed === undefined ? 45 : p.bleed) - dt;
    if (p.bleed <= 0) { p.dead = true; p.bleed = 0; continue; }
    let helper = false;
    for (const q of players) if (q !== p && q.hp > 0 && !q.afk && dist2(q.x, q.y, p.x, p.y) < 3600) { helper = true; break; }
    p.rv = helper ? (p.rv || 0) + dt : Math.max(0, (p.rv || 0) - dt);
    if (p.rv >= 3) {
      p.hp = p.mhp * 0.5; p.iv = 2; p.rv = 0; p.bleed = undefined;
      for (let i = Math.min(p.missed || 0, 3); i > 0; i--) offerPick(p);        // level-ups missed while down
      p.missed = 0; netToast((p.name || 'A player') + ' was revived');
    }
  }
}
function coopLate(e) {                                            // someone joins a run that is already going
  const p = makePlayer(e.idx, e.ch), ref = players.find(q => q.hp > 0 && !q.afk) || player;
  p.x = ref.x + 60; p.y = ref.y; p.netId = e.id; p.name = e.name; p.mhp += 3 * (level - 1); p.hp = p.mhp; e.player = p; players.push(p);
  net.tr.send(e.id, { t: 'start', seed: runSeed, late: 1 });
  for (let i = Math.min(3, Math.floor(level / 3)); i > 0; i--) offerPick(p);   // catch-up picks
  netToast(e.name + ' joined');
}
function coopRejoin(e) {                                          // a dropped player is back: resend the run, restore any open pick
  const p = e.player; if (!p) return;
  net.tr.send(e.id, { t: 'start', seed: runSeed, late: 1 });
  if (p.pick) net.tr.send(e.id, { t: 'pick', choices: p.pick.choices });
  netToast(e.name + ' reconnected');
}

/* ----- end of run ----- */
function coopGameOver() {
  state = 'over'; hidePicker(); checkAch();
  const m = { t: 'over', time: Math.floor(time), kills, level, bc: bossCount };
  for (const e of net.lobby) if (e.id !== 'host') net.tr.send(e.id, m);
  coopOver(m);
}
function coopOver(m) {
  state = 'over'; hidePicker(); stopMusic(); net.inGame = false;
  const earn = Math.floor((m.time / 6 + m.kills / 8) * (net.role === 'host' ? mutBonus() : 1));
  S.shards += earn; S.runs++; S.kills += m.kills; S.best = Math.max(S.best, m.time); save();
  show(`<h2>Run over</h2><p>${m.time}s · ${m.kills} kills · level ${m.level}</p><p class=b>+${earn}◆ shards</p>` +
    (net.role === 'host' ? '<button onclick="mpBack()">Back to lobby</button>' : '<p>Waiting for the host…</p>') + '<button onclick="mpLeave()">Leave</button>');
}
function mpBack() {
  net.running = false;
  for (const e of net.lobby.slice(1)) if (e.away) net._remove(e);
  for (const e of net.lobby) if (e.id !== 'host') net.tr.send(e.id, { t: 'tolobby' });
  state = 'lobby'; lobbyScreen();
}

function frame(t) {
  requestAnimationFrame(frame);
  const d = Math.min((t - last) / 1000, 0.1);
  last = t;
  if (net && net.role === 'client' && state === 'play') { clientFrame(d); return; }   // clients only render
  if (state === 'play') {
    acc += d;
    while (acc >= 1 / 60 && state === 'play') { tick(1 / 60); acc -= 1 / 60; }
  }
  draw();
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = 1;
  if (k === 'p' || k === 'escape') {
    if (state === 'play') pauseScreen();
    else if (state === 'pause') resume();
  }
  if (state === 'pick' && choices[+k - 1]) pickUpgrade(choices[+k - 1].id);
  if (k.startsWith('arrow') && state !== 'title') e.preventDefault();
  // Debug toggle
  if (k === 'f1' || k === '`') {
    debug = !debug;
    e.preventDefault();
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pauseScreen(); });
addEventListener('blur', () => { if (state === 'play') pauseScreen(); });

cv.addEventListener('pointerdown', e => {
  joy = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0 };
  try { cv.setPointerCapture(e.pointerId); } catch {}
});
cv.addEventListener('pointermove', e => {
  if (!joy || e.pointerId !== joy.id) return;
  let dx = (e.clientX - joy.x) / 50, dy = (e.clientY - joy.y) / 50;
  const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  joy.dx = dx; joy.dy = dy;
});
const releaseJoy = e => { if (joy && e.pointerId === joy.id) joy = null; };
cv.addEventListener('pointerup', releaseJoy);
cv.addEventListener('pointercancel', releaseJoy);

/* Expose for inline handlers */
window.start = start;
window.goSeed = goSeed;
window.toggle = toggle;
window.shopScreen = shopScreen;
window.buyUpgrade = buyUpgrade;
window.pickUpgrade = pickUpgrade;
window.resume = resume;
window.titleScreen = titleScreen;
window.copyShare = copyShare;
window.cycleBot = cycleBot;
window.editBot = editBot;
window.saveBot = saveBot;
window.cycleGenre = cycleGenre;
window.GENRES = GENRES;
window.DEFAULT_BOT = DEFAULT_BOT;
window.profileList = profileList;
window.switchProfile = switchProfile;
window.nameProfile = nameProfile;
window.saveProfileName = saveProfileName;
window.deleteProfile = deleteProfile;
window.confirmDelete = confirmDelete;
window.transferScreen = transferScreen;
window.genCode = genCode;
window.copyCode = copyCode;
window.importProfile = importProfile;

try {
  const h = location.hash;
  if (h.startsWith('#r=')) friend = decodeFriend(h.slice(3));
  else if (h.startsWith('#seed=')) friend = { s: cleanSeed(h.slice(6)), t: 0, k: 0, l: 0 };
  else if (h.startsWith('#room=')) pendingRoom = cleanRoom(h.slice(6));
} catch {}

titleScreen();
if (pendingRoom) mpJoinCode(pendingRoom);   // invite link / QR code
requestAnimationFrame(frame);
</script>
